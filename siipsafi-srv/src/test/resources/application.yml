spring:
  application:
    name: dgicp-siip2-siipsafi-srv

  # Datasource - disabled for unit tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # Security - mock OIDC for tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:0/mock-oidc

# Service Configuration
service:
  name: demo-test

# Actuator for tests
management:
  endpoints:
    web:
      exposure:
        include: health

# Logging - reduced for tests
logging:
  level:
    root: WARN
    sv.gob.mh: INFO

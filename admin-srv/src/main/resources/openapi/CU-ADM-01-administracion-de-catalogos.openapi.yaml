openapi: 3.1.0
info:
  title: CU-ADM-01-administracion de catalogos
  version: 4.1.0
  description: |
    Contrato OpenAPI consolidado del caso de uso CU-ADM-01-administracion de catalogos (CU-ADM-01 v1.3),
    alineado con el modelo de dominio v4.0 y con las pruebas Gherkin CU-ADM-01-NN-<característica>.feature.

    * Cada historia de usuario tiene su extracto OpenAPI (CU-ADM-01-NN-<característica>.yaml) y su
      contrato de servicio (CU-ADM-01-NN-<característica>-contrato-servicio.md), generados a partir
      de este archivo.
    * Cada operación indica en extensiones `x-` las historias, subflujos, errores, contratos de
      servicio y pruebas que la cubren, y el servicio de aplicación que la implementa.
    * Las estructuras de resultado de SF-10, SF-11, SF-12 y SF-13 son las definidas en el CU.
    * Los códigos de error son los de la sección 9 del CU (E-01 a E-25) y, donde el CU no
      define código, los del modelo de dominio (S-04, S-05).
    * **Propuesta:** las rutas, los verbos HTTP y la correspondencia código de error → estado
      HTTP no están definidos en el CU; son una propuesta a validar (pendiente P-08 en
      historias-CU-ADM-01.md). Correspondencia: 403 = E-25; 404 = E-10, E-22; 405 = E-24;
      409 = conflicto con el estado actual; 422 = datos inválidos.
    * Seguridad (RN-25, S-08): las operaciones GET están abiertas a cualquier usuario
      autenticado y a los Sistemas Consumidores; las demás exigen el rol
      ADMINISTRADOR_DE_CATALOGOS (E-25).
    * Fechas en ISO-8601 (AAAA-MM-DD).
    * RN-04 / S-09: en las solicitudes el tipo de un campo es opcional; si se omite, el
      campo se crea como STRING {80}. Las respuestas siempre informan el tipo efectivo.
    * El contrato no incluye datos de auditoría (usuario o fecha de creación/modificación).
  x-caso-uso:
    codigo: CU-ADM-01
    nombre: CU-ADM-01-administracion de catalogos
    version: '1.3'
    modelo-dominio: modelo-dominio-catalogos.md v4.0
tags:
  - name: catalogos
    description: Catálogos del catalogMaster (SF-01 a SF-06, SF-12, SF-15)
  - name: registros
    description: Registros de un catálogo (SF-07 a SF-11, SF-13)
security:
  - bearerAuth: []

paths:
  /catalogos:
    get:
      tags: [catalogos]
      operationId: buscarListarCatalogos
      summary: SF-03 — Buscar por código o nombre, o listar el catalogMaster (RN-09)
      description: |
        Sin parámetros retorna todos los catálogos, activos e inactivos.

        Errores: ninguno (las búsquedas sin coincidencias retornan una lista vacía).
      parameters:
        - {name: codigo, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: nombre, in: query, required: false, schema: {type: string, maxLength: 255}}
      responses:
        '200':
          description: Catálogos encontrados (lista vacía = no existe un catálogo con ese código o nombre)
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CatalogoResumen'}}
      x-historias: [HU-ADM-01-04]
      x-subflujos: [SF-03]
      x-errores: []
      x-servicio:
        - 'CatalogQueryService.findByCode(String code) : Optional<Catalog>'
        - 'CatalogQueryService.findByName(String name) : List<Catalog>'
        - 'CatalogQueryService.listCatalogs() : List<Catalog>'
      x-contrato-servicio:
        - CU-ADM-01-04-listar-catalogos-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-04-listar-catalogos.feature
    post:
      tags: [catalogos]
      operationId: crearCatalogo
      summary: SF-01 — Crear catálogo (RN-02, RN-03, RN-04, RN-05, RN-10, RN-15, RN-16, RN-20)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogoCreacion'}
      responses:
        '201':
          description: Catálogo creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalogo'}
        '403': {$ref: '#/components/responses/E25'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Validacion'}
      description: |
        Errores: E-25 (403), E-01 (409), E-02 (422), E-03 (422), E-04 (422), E-05 (422), E-06 (422), E-07 (409), E-09 (422), E-15 (409), E-23 (422), S-05 (422).
      x-historias: [HU-ADM-01-01]
      x-subflujos: [SF-01]
      x-errores: [E-25, E-01, E-02, E-03, E-04, E-05, E-06, E-07, E-09, E-15, E-23, S-05]
      x-servicio:
        - 'CatalogAdminService.createCatalog(CreateCatalogCommand cmd) : Catalog'
      x-contrato-servicio:
        - CU-ADM-01-01-crear-catalogo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-01-crear-catalogo.feature

  /catalogos/{codigo}:
    parameters:
      - $ref: '#/components/parameters/codigo'
    get:
      tags: [catalogos]
      operationId: consultarCatalogo
      summary: SF-02 — Consultar catálogo por código (RN-22, RN-23)
      responses:
        '200':
          description: Definición completa, campos ordenados por posición
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalogo'}
        '404': {$ref: '#/components/responses/E10'}
      description: |
        Errores: E-10 (404).
      x-historias: [HU-ADM-01-03]
      x-subflujos: [SF-02]
      x-errores: [E-10]
      x-servicio:
        - 'CatalogQueryService.findCatalog(String code) : Catalog'
      x-contrato-servicio:
        - CU-ADM-01-03-consultar-catalogo-por-codigo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-03-consultar-catalogo-por-codigo.feature
    put:
      tags: [catalogos]
      operationId: actualizarDescriptores
      summary: SF-04 / SF-15 — Actualizar nombre, padre, estado y vigencia (RN-19, RN-23)
      description: |
        El código no es modificable (E-11). Cambiar el estado aplica SF-05 (inactivación en
        cascada) o SF-06 (reactivación). Cambiar el padre de un catálogo con registros exige
        `confirmarCambioPadre = true` (S-04); al asignar un padre nuevo, `registrosPadre`
        indica el registro padre de cada registro (modelo de dominio v4.0) y un registro sin
        registro padre válido produce E-18.

        Errores: E-25 (403), E-10 (404), E-11 (422), E-09 (422), E-06 (422), E-07 (409), E-08 (409), E-15 (409), E-16 (409), S-04 (409), E-18 (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogoDescriptores'}
      responses:
        '200':
          description: Descriptores actualizados
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalogo'}
        '403': {$ref: '#/components/responses/E25'}
        '404': {$ref: '#/components/responses/E10'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-05, HU-ADM-01-06]
      x-subflujos: [SF-04, SF-15]
      x-errores: [E-25, E-10, E-11, E-09, E-06, E-07, E-08, E-15, E-16, S-04, E-18]
      x-servicio:
        - 'CatalogAdminService.updateDescriptors(String code, UpdateCatalogCommand cmd) : Catalog'
      x-contrato-servicio:
        - CU-ADM-01-05-actualizar-descriptores-catalogo-contrato-servicio.md
        - CU-ADM-01-06-establecer-jerarquia-catalogo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-05-actualizar-descriptores-catalogo.feature
        - CU-ADM-01-06-establecer-jerarquia-catalogo.feature
    delete:
      tags: [catalogos]
      operationId: eliminarCatalogo
      summary: No permitido (RN-13)
      responses:
        '405': {$ref: '#/components/responses/E24'}
      description: |
        Errores: E-24 (405).
      x-historias: [HU-ADM-01-07]
      x-subflujos: [SF-05]
      x-errores: [E-24]
      x-servicio:
        - 'Sin método de servicio: la capa web responde E-24 (RN-13).'
      x-contrato-servicio:
        - CU-ADM-01-07-inactivar-catalogo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-07-inactivar-catalogo.feature

  /catalogos/{codigo}/campos:
    parameters:
      - $ref: '#/components/parameters/codigo'
    put:
      tags: [catalogos]
      operationId: actualizarCampos
      summary: SF-04 paso 5 — Reemplazar la definición de campos (RN-03, RN-04, RN-20, RN-21)
      description: |
        Solo si el catálogo no tiene registros (E-12).

        Errores: E-25 (403), E-10 (404), E-12 (409), E-02 (422), E-03 (422), E-04 (422), E-05 (422), E-23 (422), S-05 (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Lista vacía produce E-02 (RN-20).
              items: {$ref: '#/components/schemas/CampoDefinicion'}
      responses:
        '200':
          description: Campos actualizados
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalogo'}
        '403': {$ref: '#/components/responses/E25'}
        '404': {$ref: '#/components/responses/E10'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-02]
      x-subflujos: [SF-04]
      x-errores: [E-25, E-10, E-12, E-02, E-03, E-04, E-05, E-23, S-05]
      x-servicio:
        - 'CatalogAdminService.updateFields(String code, List<FieldDefinition> definitions) : Catalog'
      x-contrato-servicio:
        - CU-ADM-01-02-actualizar-campos-catalogo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-02-actualizar-campos-catalogo.feature

  /catalogos/{codigo}/estado:
    parameters:
      - $ref: '#/components/parameters/codigo'
    put:
      tags: [catalogos]
      operationId: cambiarEstadoCatalogo
      summary: SF-05 / SF-06 — Inactivar o reactivar catálogo (RN-06, RN-12, RN-14, RN-16)
      description: |
        INACTIVE fija TO DATE = hoy e inactiva en cascada los registros del catálogo y,
        recursivamente, el catálogo hijo con sus registros (RN-06). Fijar solo `hasta` en hoy
        o en el pasado también inactiva (RN-12b). ACTIVE exige catálogo padre ACTIVE (E-15) y
        TO DATE vacía o futura (E-16); no reactiva registros ni catálogos hijos (S-03).
        Operación equivalente a cambiar `estado` o `vigencia` con PUT /catalogos/{codigo}
        (SF-04 paso 4), expuesta por separado como en los registros (SF-09).

        Errores: E-25 (403), E-10 (404), E-09 (422), E-15 (409), E-16 (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CambioEstado'}
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalogo'}
        '403': {$ref: '#/components/responses/E25'}
        '404': {$ref: '#/components/responses/E10'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-07, HU-ADM-01-08]
      x-subflujos: [SF-05, SF-06]
      x-errores: [E-25, E-10, E-09, E-15, E-16]
      x-servicio:
        - 'CatalogAdminService.inactivateCatalog(String code) : void (estado INACTIVE)'
        - 'CatalogAdminService.setCatalogToDate(String code, LocalDate toDate) : void (solo hasta)'
        - 'CatalogAdminService.reactivateCatalog(String code, LocalDate newToDate) : void (estado ACTIVE)'
      x-contrato-servicio:
        - CU-ADM-01-07-inactivar-catalogo-contrato-servicio.md
        - CU-ADM-01-08-reactivar-catalogo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-07-inactivar-catalogo.feature
        - CU-ADM-01-08-reactivar-catalogo.feature

  /catalogos/{codigo}/hijo:
    parameters:
      - $ref: '#/components/parameters/codigo'
    get:
      tags: [catalogos]
      operationId: consultarCatalogoHijo
      summary: SF-12 — Consultar catálogo hijo (RN-17)
      responses:
        '200':
          description: Catálogo hijo, o null si no tiene
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChildCatalogResult'
                  - type: 'null'
        '404': {$ref: '#/components/responses/E10'}
      description: |
        Errores: E-10 (404).
      x-historias: [HU-ADM-01-14]
      x-subflujos: [SF-12]
      x-errores: [E-10]
      x-servicio:
        - 'CatalogQueryService.findChildCatalog(String parentCode) : Optional<ChildCatalogResult>'
      x-contrato-servicio:
        - CU-ADM-01-14-consultar-catalogo-hijo-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-14-consultar-catalogo-hijo.feature

  /catalogos/{codigo}/registros:
    parameters:
      - $ref: '#/components/parameters/codigo'
    get:
      tags: [registros]
      operationId: listarRegistros
      summary: SF-11 — Listar registros del catálogo (RN-08)
      parameters:
        - $ref: '#/components/parameters/campos'
      responses:
        '200':
          description: Resultado (resultSet puede ser vacío)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogRecordsResult'}
        '404': {$ref: '#/components/responses/E10'}
        '422': {$ref: '#/components/responses/Validacion'}
      description: |
        Errores: E-10 (404), E-21 (422).
      x-historias: [HU-ADM-01-13]
      x-subflujos: [SF-11]
      x-errores: [E-10, E-21]
      x-servicio:
        - 'CatalogQueryService.listRecords(String catalogCode, List<String> campos) : CatalogRecordsResult'
      x-contrato-servicio:
        - CU-ADM-01-13-buscar-lista-registros-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-13-buscar-lista-registros.feature
    post:
      tags: [registros]
      operationId: crearRegistro
      summary: SF-07 — Crear registro (RN-01, RN-05, RN-11, RN-14, RN-15, RN-16)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistroCreacion'}
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Registro'}
        '403': {$ref: '#/components/responses/E25'}
        '404': {$ref: '#/components/responses/E10'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Validacion'}
      description: |
        Errores: E-25 (403), E-10 (404), E-13 (409), E-17 (409), E-14 (422), E-18 (422), E-21 (422), E-09 (422).
      x-historias: [HU-ADM-01-09]
      x-subflujos: [SF-07]
      x-errores: [E-25, E-10, E-13, E-17, E-14, E-18, E-21, E-09]
      x-servicio:
        - 'CatalogAdminService.createRecord(CreateRecordCommand cmd) : CatalogRecord'
      x-contrato-servicio:
        - CU-ADM-01-09-crear-registro-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-09-crear-registro.feature

  /catalogos/{codigo}/registros/{llave}:
    parameters:
      - $ref: '#/components/parameters/codigo'
      - $ref: '#/components/parameters/llave'
    get:
      tags: [registros]
      operationId: buscarRegistroPorLlave
      summary: SF-10 — Buscar registro por llave (RN-07)
      description: |
        Si no hay coincidencia, resultSet es vacío (no es error).

        Errores: E-10 (404), E-21 (422).
      parameters:
        - $ref: '#/components/parameters/campos'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeySearchResult'}
        '404': {$ref: '#/components/responses/E10'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-12]
      x-subflujos: [SF-10]
      x-errores: [E-10, E-21]
      x-servicio:
        - 'CatalogQueryService.findRecordByKey(String catalogCode, String argumento, List<String> campos) : KeySearchResult'
      x-contrato-servicio:
        - CU-ADM-01-12-buscar-registro-por-clave-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-12-buscar-registro-por-clave.feature
    patch:
      tags: [registros]
      operationId: actualizarRegistro
      summary: SF-08 — Actualizar campos no KEY (RN-11, RN-18)
      description: |
        Un registro inexistente produce E-22 (modelo de dominio v4.0, pendiente P-05).

        Errores: E-25 (403), E-10 (404), E-22 (404), E-19 (422), E-14 (422), E-21 (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Nombre de campo → nuevo valor (STRING). Incluir el campo KEY produce E-19.
              minProperties: 1
              additionalProperties: {type: string, maxLength: 4000}
            example: {nombre: República de Colombia}
      responses:
        '200':
          description: Registro actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Registro'}
        '403': {$ref: '#/components/responses/E25'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-10]
      x-subflujos: [SF-08]
      x-errores: [E-25, E-10, E-22, E-19, E-14, E-21]
      x-servicio:
        - 'CatalogAdminService.updateRecord(String catalogCode, String keyValue, Map<String, String> values) : CatalogRecord'
      x-contrato-servicio:
        - CU-ADM-01-10-actualizar-registro-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-10-actualizar-registro.feature
    delete:
      tags: [registros]
      operationId: eliminarRegistro
      summary: No permitido (RN-14)
      responses:
        '405': {$ref: '#/components/responses/E24'}
      description: |
        Errores: E-24 (405).
      x-historias: [HU-ADM-01-11]
      x-subflujos: [SF-09]
      x-errores: [E-24]
      x-servicio:
        - 'Sin método de servicio: la capa web responde E-24 (RN-14).'
      x-contrato-servicio:
        - CU-ADM-01-11-inactivar-registro-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-11-inactivar-registro.feature

  /catalogos/{codigo}/registros/{llave}/estado:
    parameters:
      - $ref: '#/components/parameters/codigo'
      - $ref: '#/components/parameters/llave'
    put:
      tags: [registros]
      operationId: cambiarEstadoRegistro
      summary: SF-09 — Inactivar o reactivar registro (RN-12, RN-14, RN-16)
      description: |
        INACTIVE fija TO DATE = hoy e inactiva en cascada los registros hijos. Fijar solo
        `hasta` en hoy o en el pasado también inactiva. ACTIVE exige catálogo y registro padre
        ACTIVE (E-20) y TO DATE vacía o futura (E-16); no reactiva hijos (S-03).

        Errores: E-25 (403), E-10 (404), E-22 (404), E-09 (422), E-16 (409), E-20 (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CambioEstado'}
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Registro'}
        '403': {$ref: '#/components/responses/E25'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-11]
      x-subflujos: [SF-09]
      x-errores: [E-25, E-10, E-22, E-09, E-16, E-20]
      x-servicio:
        - 'CatalogAdminService.inactivateRecord(String catalogCode, String keyValue) : void (estado INACTIVE)'
        - 'CatalogAdminService.setRecordToDate(String catalogCode, String keyValue, LocalDate toDate) : void (solo
          hasta)'
        - 'CatalogAdminService.reactivateRecord(String catalogCode, String keyValue, LocalDate newToDate) : void
          (estado ACTIVE)'
      x-contrato-servicio:
        - CU-ADM-01-11-inactivar-registro-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-11-inactivar-registro.feature

  /catalogos/{codigo}/registros/{llave}/hijos:
    parameters:
      - $ref: '#/components/parameters/codigo'
      - $ref: '#/components/parameters/llave'
    get:
      tags: [registros]
      operationId: buscarRegistrosHijos
      summary: SF-13 — Buscar registros hijos de un registro padre (RN-24)
      description: |
        `codigo` es el catálogo padre y `llave` el valor KEY del registro padre. Si el
        catálogo padre no tiene hijo, codigoCatalogoHijo es null y resultSet vacío.

        Errores: E-10 (404), E-22 (404), E-21 (422).
      parameters:
        - $ref: '#/components/parameters/campos'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChildRecordsResult'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
      x-historias: [HU-ADM-01-15]
      x-subflujos: [SF-13]
      x-errores: [E-10, E-22, E-21]
      x-servicio:
        - 'CatalogQueryService.findChildRecords(String parentCode, String argumento, List<String> campos) : ChildRecordsResult'
      x-contrato-servicio:
        - CU-ADM-01-15-consultar-registros-hijos-contrato-servicio.md
      x-pruebas:
        - CU-ADM-01-15-consultar-registros-hijos.feature

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}

  parameters:
    codigo:
      name: codigo
      in: path
      required: true
      description: Código del catálogo
      schema: {type: string, maxLength: 64}
    llave:
      name: llave
      in: path
      required: true
      description: Valor del campo KEY del registro
      schema: {type: string, maxLength: 255}
    campos:
      name: campos
      in: query
      required: false
      description: Conjunto de campos (algoritmo 4.1). Vacío = KEY + primer campo no KEY de menor posición.
      style: form
      explode: false
      schema: {type: array, items: {type: string, maxLength: 128}}

  schemas:
    Estado:
      type: string
      enum: [ACTIVE, INACTIVE]
    Calificador:
      type: string
      enum: [KEY, FIELD]
    TipoCampo:
      type: string
      enum: [NUMERIC, STRING, FECHA, ENUM]

    CampoDefinicion:
      type: object
      description: |
        Definición de campo en las solicitudes (RN-03, RN-04, S-05). Solo se informan los
        parámetros del tipo declarado (E-05). `tipo` es opcional: si se omite (o es null), el
        campo se crea como STRING {80} y se ignoran los demás parámetros de tipo (RN-04, S-09).
      required: [nombre, calificador, posicion]
      properties:
        nombre: {type: string, maxLength: 128}
        calificador: {$ref: '#/components/schemas/Calificador'}
        posicion: {type: integer, description: 'Entero positivo, único en el catálogo (S-05)'}
        tipo:
          oneOf:
            - $ref: '#/components/schemas/TipoCampo'
            - type: 'null'
          description: Omitido o null = STRING {80}
        minimo: {type: [number, 'null'], description: 'NUMERIC {mínimo : máximo}'}
        maximo: {type: [number, 'null']}
        longitudMaxima:
          type: [integer, 'null']
          description: 'STRING {n}, 1 a 4000. Para el campo KEY, máximo 255 (modelo de dominio v4.0). Fuera de rango
            produce E-05.'
        fechaDesde: {type: [string, 'null'], format: date, description: 'FECHA {desde : hasta}'}
        fechaHasta: {type: [string, 'null'], format: date}
        valores:
          type: array
          description: ENUM {s1, s2, …}, no vacío y sin duplicados (E-05)
          items: {type: string, maxLength: 255}
      example: {nombre: descripcion, calificador: FIELD, posicion: 2}

    Campo:
      type: object
      description: Definición de campo en las respuestas, con su tipo efectivo (un campo definido sin tipo se 
        informa como STRING con longitudMaxima 80).
      required: [nombre, calificador, tipo, posicion]
      properties:
        nombre: {type: string, maxLength: 128}
        calificador: {$ref: '#/components/schemas/Calificador'}
        posicion: {type: integer, minimum: 1}
        tipo: {$ref: '#/components/schemas/TipoCampo'}
        minimo: {type: [number, 'null'], description: 'NUMERIC {mínimo : máximo}'}
        maximo: {type: [number, 'null']}
        longitudMaxima:
          type: [integer, 'null']
          minimum: 1
          maximum: 4000
          description: 'STRING {n}'
        fechaDesde: {type: [string, 'null'], format: date, description: 'FECHA {desde : hasta}'}
        fechaHasta: {type: [string, 'null'], format: date}
        valores:
          type: array
          description: ENUM {s1, s2, …}
          uniqueItems: true
          items: {type: string, maxLength: 255}
      example: {nombre: descripcion, calificador: FIELD, posicion: 2, tipo: STRING, longitudMaxima: 80}

    Vigencia:
      type: object
      properties:
        desde: {type: [string, 'null'], format: date}
        hasta: {type: [string, 'null'], format: date, description: TO DATE}

    CatalogoResumen:
      type: object
      required: [codigo, nombre, estado]
      properties:
        codigo: {type: string}
        nombre: {type: string}
        padre: {type: [string, 'null']}
        hijo: {type: [string, 'null']}
        estado: {$ref: '#/components/schemas/Estado'}
        vigencia: {$ref: '#/components/schemas/Vigencia'}

    Catalogo:
      allOf:
        - $ref: '#/components/schemas/CatalogoResumen'
        - type: object
          required: [campos]
          properties:
            campos:
              type: array
              description: Ordenados por posición
              items: {$ref: '#/components/schemas/Campo'}

    CatalogoCreacion:
      type: object
      required: [codigo, nombre, estado, campos]
      properties:
        codigo: {type: string, maxLength: 64}
        nombre: {type: string, maxLength: 255}
        padre: {type: [string, 'null'], description: 'Código del catálogo padre (E-06, E-07, E-15)'}
        estado: {$ref: '#/components/schemas/Estado'}
        vigencia: {$ref: '#/components/schemas/Vigencia'}
        campos:
          type: array
          description: Lista vacía produce E-02 (RN-20).
          items: {$ref: '#/components/schemas/CampoDefinicion'}

    CatalogoDescriptores:
      type: object
      description: El código no es modificable (RN-19). Enviar un código distinto al de la ruta produce E-11.
      required: [nombre, estado]
      properties:
        codigo: {type: [string, 'null'], maxLength: 64, description: Opcional; debe coincidir con el de la 
            ruta (E-11)}
        nombre: {type: string, maxLength: 255}
        padre: {type: [string, 'null']}
        estado: {$ref: '#/components/schemas/Estado'}
        vigencia: {$ref: '#/components/schemas/Vigencia'}
        confirmarCambioPadre: {type: boolean, default: false, description: S-04}
        registrosPadre:
          type: object
          description: |
            S-04 (modelo de dominio v4.0): al asignar un padre nuevo a un catálogo con
            registros, valor KEY de cada registro → valor KEY de su nuevo registro padre en el
            catálogo padre. Un registro sin entrada o con un registro padre inexistente o
            inactivo produce E-18.
          additionalProperties: {type: string, maxLength: 255}
      example:
        nombre: Departamentos
        padre: PAIS
        estado: ACTIVE
        confirmarCambioPadre: true
        registrosPadre: {ANT: COL, CUN: COL}

    RegistroCreacion:
      type: object
      required: [valores]
      properties:
        valores:
          type: object
          description: Nombre de campo → valor (STRING). Todos los campos del catálogo, incluido el KEY (E-14,
            E-21).
          additionalProperties: {type: string, maxLength: 4000}
        registroPadre:
          type: [string, 'null']
          description: Valor KEY del registro padre; obligatorio si el catálogo tiene padre (E-18)
        vigencia: {$ref: '#/components/schemas/Vigencia'}
      example:
        valores: {codDepto: ANT, nombre: Antioquia}
        registroPadre: COL

    Registro:
      type: object
      required: [codigoCatalogo, llave, valores, estado]
      properties:
        codigoCatalogo: {type: string}
        llave: {type: string}
        registroPadre: {type: [string, 'null']}
        valores:
          type: object
          additionalProperties: {type: string}
        estado: {$ref: '#/components/schemas/Estado'}
        vigencia: {$ref: '#/components/schemas/Vigencia'}

    CambioEstado:
      type: object
      properties:
        estado: {$ref: '#/components/schemas/Estado'}
        hasta: {type: [string, 'null'], format: date, description: Nueva TO DATE}

    ResultRow:
      type: object
      required: [valores, estado]
      properties:
        valores:
          type: array
          description: Valores en el orden del fieldSet
          items: {type: string}
        estado: {$ref: '#/components/schemas/Estado'}

    KeySearchResult:
      type: object
      description: Resultado de SF-10
      required: [argumentoBusqueda, codigoCatalogo, fieldSet, resultSet]
      properties:
        argumentoBusqueda: {type: string}
        codigoCatalogo: {type: string}
        fieldSet: {type: array, items: {type: string}}
        resultSet:
          type: array
          maxItems: 1
          items: {$ref: '#/components/schemas/ResultRow'}
      example:
        argumentoBusqueda: COL
        codigoCatalogo: PAIS
        fieldSet: [codPais, nombre]
        resultSet: [{valores: [COL, Colombia], estado: ACTIVE}]

    CatalogRecordsResult:
      type: object
      description: Resultado de SF-11
      required: [codigoCatalogo, fieldSet, resultSet]
      properties:
        codigoCatalogo: {type: string}
        fieldSet: {type: array, items: {type: string}}
        resultSet: {type: array, items: {$ref: '#/components/schemas/ResultRow'}}

    ChildCatalogResult:
      type: object
      description: Resultado de SF-12
      required: [codigo, nombre]
      properties:
        codigo: {type: string}
        nombre: {type: string}

    ChildRecordsResult:
      type: object
      description: Resultado de SF-13
      required: [argumento, codigoCatalogoPadre, codigoCatalogoHijo, fieldSet, resultSet]
      properties:
        argumento: {type: string}
        codigoCatalogoPadre: {type: string}
        codigoCatalogoHijo: {type: [string, 'null']}
        fieldSet: {type: array, items: {type: string}}
        resultSet: {type: array, items: {$ref: '#/components/schemas/ResultRow'}}

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          description: Código de la sección 9 del CU (o S-04 / S-05 del modelo de dominio)
          pattern: '^(E-(0[1-9]|1[0-9]|2[0-5])|S-0[45])$'
        mensaje: {type: string}
      example: {codigo: E-01, mensaje: Ya existe un catálogo con el código PAIS.}

  responses:
    Validacion:
      description: 'Datos inválidos: E-02, E-03, E-04, E-05, E-06, E-09, E-11, E-14, E-18, E-19, E-21, E-23, S-05'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflicto:
      description: 'Conflicto con el estado actual: E-01, E-07, E-08, E-12, E-13, E-15, E-16, E-17, E-20, S-04'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    E10:
      description: E-10 — El catálogo no existe
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoEncontrado:
      description: E-10 (catálogo) o E-22 (registro con esa llave)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    E24:
      description: E-24 — Solo se admite la inactivación
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    E25:
      description: E-25 — Usuario sin rol de Administrador de Catálogos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

              schema:
                $ref: '#/components/schemas/CatalogRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogOrRecordNotFound'
        '422':
          description: 'La solicitud es válida según el esquema pero viola una regla de negocio. Códigos: `VALOR_CAMPO_INVALIDO`

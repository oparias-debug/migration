servers:
- url: /api/v1
  description: Base del API de SIIP v2
security:
- bearerAuth: []
tags:
- name: AdministracionCatalogos
  description: Módulo de Administración de Catálogos (catalogMaster). Nombre provisional derivado del prefijo ADM del CU;
    ajustar cuando se defina la WBS.
paths:
  /catalogos:
    post:
      tags:
      - AdministracionCatalogos
      operationId: crearCatalogo
      summary: Crear un catálogo
      description: |
        SF-01. Crea un catálogo con código, nombre, padre opcional, estado, vigencia y campos tipados.
        Sin fechas de vigencia queda `ACTIVE` (RN-15); con `toDate` hoy o pasada queda `INACTIVE` (RN-16);
        con `active: INACTIVE` y sin `toDate`, `toDate` = fecha actual (RN-12a). Si se indica `parent`,
        el catálogo padre debe existir (E-06), estar activo (E-15) y no tener ya un hijo (E-07).
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-01
        - HU-ADM-01-02
        - HU-ADM-01-06
        features:
        - CU-ADM-01-crear-catalogo.feature
        - CU-ADM-01-actualizar-campos-catalogo.feature
        - CU-ADM-01-establecer-jerarquia-catalogo.feature
        reglas:
        - RN-02
        - RN-03
        - RN-04
        - RN-05
        - RN-10
        - RN-12
        - RN-15
        - RN-16
        - RN-20
        excepciones:
        - E-01
        - E-02
        - E-03
        - E-04
        - E-05
        - E-06
        - E-07
        - E-09
        - E-15
        - E-23
        - E-25
        - S-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCreateRequest'
      responses:
        '201':
          description: Catálogo creado.
          headers:
            Location:
              description: URI del recurso creado (`/catalogos/{code}`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'El estado actual del recurso impide la operación. Códigos: `CODIGO_CATALOGO_DUPLICADO` (E-01), `CATALOGO_PADRE_CON_HIJO`
            (E-07), `CATALOGO_PADRE_INACTIVO` (E-15).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CODIGO_CATALOGO_DUPLICADO:
                  summary: E-01 · CODIGO_CATALOGO_DUPLICADO
                  value:
                    codigo: CODIGO_CATALOGO_DUPLICADO
                    mensaje: Ya existe un catálogo con el código PAIS.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: code
                      codigo: CODIGO_CATALOGO_DUPLICADO
                      mensaje: Ya existe un catálogo con el código PAIS.
                CATALOGO_PADRE_CON_HIJO:
                  summary: E-07 · CATALOGO_PADRE_CON_HIJO
                  value:
                    codigo: CATALOGO_PADRE_CON_HIJO
                    mensaje: El catálogo PAIS ya tiene un catálogo hijo (DEPTO).
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: CATALOGO_PADRE_CON_HIJO
                      mensaje: El catálogo PAIS ya tiene un catálogo hijo (DEPTO).
                CATALOGO_PADRE_INACTIVO:
                  summary: E-15 · CATALOGO_PADRE_INACTIVO
                  value:
                    codigo: CATALOGO_PADRE_INACTIVO
                    mensaje: El catálogo padre PAIS está inactivo.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: CATALOGO_PADRE_INACTIVO
                      mensaje: El catálogo padre PAIS está inactivo.
        '422':
          description: 'La solicitud es válida según el esquema pero viola una regla de negocio. Códigos: `CATALOGO_SIN_CAMPOS`
            (E-02), `CATALOGO_SIN_CAMPO_KEY` (E-03), `NOMBRE_CAMPO_DUPLICADO` (E-04), `DEFINICION_TIPO_INVALIDA` (E-05), `CATALOGO_PADRE_INEXISTENTE`
            (E-06), `VIGENCIA_INVALIDA` (E-09), `CATALOGO_CON_MULTIPLES_KEY` (E-23), `POSICION_CAMPO_INVALIDA` (S-05).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATALOGO_SIN_CAMPOS:
                  summary: E-02 · CATALOGO_SIN_CAMPOS
                  value:
                    codigo: CATALOGO_SIN_CAMPOS
                    mensaje: El catálogo debe tener al menos un campo.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields
                      codigo: CATALOGO_SIN_CAMPOS
                      mensaje: El catálogo debe tener al menos un campo.
                CATALOGO_SIN_CAMPO_KEY:
                  summary: E-03 · CATALOGO_SIN_CAMPO_KEY
                  value:
                    codigo: CATALOGO_SIN_CAMPO_KEY
                    mensaje: El catálogo debe tener un campo KEY.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields
                      codigo: CATALOGO_SIN_CAMPO_KEY
                      mensaje: El catálogo debe tener un campo KEY.
                NOMBRE_CAMPO_DUPLICADO:
                  summary: E-04 · NOMBRE_CAMPO_DUPLICADO
                  value:
                    codigo: NOMBRE_CAMPO_DUPLICADO
                    mensaje: El nombre de campo nombre está repetido.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields[2].name
                      codigo: NOMBRE_CAMPO_DUPLICADO
                      mensaje: El nombre de campo nombre está repetido.
                DEFINICION_TIPO_INVALIDA:
                  summary: E-05 · DEFINICION_TIPO_INVALIDA
                  value:
                    codigo: DEFINICION_TIPO_INVALIDA
                    mensaje: Definición de tipo inválida en el campo poblacion.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields[3]
                      codigo: DEFINICION_TIPO_INVALIDA
                      mensaje: Definición de tipo inválida en el campo poblacion.
                CATALOGO_PADRE_INEXISTENTE:
                  summary: E-06 · CATALOGO_PADRE_INEXISTENTE
                  value:
                    codigo: CATALOGO_PADRE_INEXISTENTE
                    mensaje: El catálogo padre NOEXISTE no existe.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: CATALOGO_PADRE_INEXISTENTE
                      mensaje: El catálogo padre NOEXISTE no existe.
                VIGENCIA_INVALIDA:
                  summary: E-09 · VIGENCIA_INVALIDA
                  value:
                    codigo: VIGENCIA_INVALIDA
                    mensaje: Rango de vigencia inválido.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: VIGENCIA_INVALIDA
                      mensaje: Rango de vigencia inválido.
                CATALOGO_CON_MULTIPLES_KEY:
                  summary: E-23 · CATALOGO_CON_MULTIPLES_KEY
                  value:
                    codigo: CATALOGO_CON_MULTIPLES_KEY
                    mensaje: El catálogo solo admite un campo KEY.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields
                      codigo: CATALOGO_CON_MULTIPLES_KEY
                      mensaje: El catálogo solo admite un campo KEY.
                POSICION_CAMPO_INVALIDA:
                  summary: S-05 · POSICION_CAMPO_INVALIDA
                  value:
                    codigo: POSICION_CAMPO_INVALIDA
                    mensaje: La posición 2 está repetida en el catálogo.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields[1].posicion
                      codigo: POSICION_CAMPO_INVALIDA
                      mensaje: La posición 2 está repetida en el catálogo.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - AdministracionCatalogos
      operationId: listarCatalogos
      summary: Buscar catálogos por código o nombre, o listar el catalogMaster
      description: |
        SF-03. Sin parámetros retorna todos los catálogos, activos e inactivos. Con `code` o `name`
        retorna los catálogos que coinciden; una lista vacía significa que no existe un catálogo con ese
        código o nombre (no es error). Reemplaza a `verificarExistenciaCatalogo` (HU-ADM-01-04 reúne ambas búsquedas).
      security:
      - bearerAuth: []
      x-roles:
      - USUARIO
      - SISTEMA_CONSUMIDOR
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-04
        features:
        - CU-ADM-01-listar-catalogos.feature
        reglas:
        - RN-09
        - RN-25
        excepciones: []
      parameters:
      - $ref: '#/components/parameters/CatalogCodeQuery'
      - $ref: '#/components/parameters/CatalogNameQuery'
      responses:
        '200':
          description: Catálogos (posiblemente vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalogos/{code}:
    parameters:
    - $ref: '#/components/parameters/CatalogCode'
    get:
      tags:
      - AdministracionCatalogos
      operationId: consultarCatalogoPorCodigo
      summary: Consultar un catálogo por código
      description: |
        SF-02. Definición completa: descriptores, padre, hijo y campos ordenados por `posicion`.
      security:
      - bearerAuth: []
      x-roles:
      - USUARIO
      - SISTEMA_CONSUMIDOR
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-03
        features:
        - CU-ADM-01-consultar-catalogo-por-codigo.feature
        reglas:
        - RN-22
        - RN-23
        - RN-25
        excepciones:
        - E-10
      responses:
        '200':
          description: Definición completa del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - AdministracionCatalogos
      operationId: actualizarDescriptoresCatalogo
      summary: Actualizar los descriptores de un catálogo
      description: |
        SF-04 y SF-15. Actualiza parcialmente `name`, `parent`, `active`, `fromDate` y/o `toDate`.
        - El código no es modificable: `code` distinto del de la ruta → `CODIGO_CATALOGO_INMUTABLE` (E-11).
        - `parent`: aplica las validaciones de jerarquía (E-06, E-07, E-08, E-15). `parent: null` deja el
          catálogo plano. Si el catálogo tiene registros, exige `confirmParentChange: true` (S-04).
        - `active: INACTIVE` equivale a `inactivarCatalogo` (SF-05, cascada RN-06); `active: ACTIVE` sobre un
          catálogo inactivo equivale a `reactivarCatalogo` (SF-06).
        - `toDate` hoy o pasada inactiva el catálogo en cascada (RN-12b, RN-16); una fecha futura no cambia el estado.
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-05
        - HU-ADM-01-06
        - HU-ADM-01-07
        features:
        - CU-ADM-01-actualizar-descriptores-catalogo.feature
        - CU-ADM-01-establecer-jerarquia-catalogo.feature
        - CU-ADM-01-inactivar-catalogo.feature
        reglas:
        - RN-05
        - RN-06
        - RN-12
        - RN-16
        - RN-17
        - RN-19
        - RN-23
        excepciones:
        - E-06
        - E-07
        - E-08
        - E-09
        - E-10
        - E-11
        - E-15
        - E-16
        - E-25
        - S-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogDescriptorsUpdateRequest'
      responses:
        '200':
          description: Descriptores actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogNotFound'
        '409':
          description: 'El estado actual del recurso impide la operación. Códigos: `CATALOGO_PADRE_CON_HIJO` (E-07), `CATALOGO_PADRE_INACTIVO`
            (E-15), `FECHA_VIGENCIA_VENCIDA` (E-16), `CONFIRMACION_CAMBIO_PADRE_REQUERIDA` (S-04).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATALOGO_PADRE_CON_HIJO:
                  summary: E-07 · CATALOGO_PADRE_CON_HIJO
                  value:
                    codigo: CATALOGO_PADRE_CON_HIJO
                    mensaje: El catálogo PAIS ya tiene un catálogo hijo (DEPTO).
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: CATALOGO_PADRE_CON_HIJO
                      mensaje: El catálogo PAIS ya tiene un catálogo hijo (DEPTO).
                CATALOGO_PADRE_INACTIVO:
                  summary: E-15 · CATALOGO_PADRE_INACTIVO
                  value:
                    codigo: CATALOGO_PADRE_INACTIVO
                    mensaje: El catálogo padre PAIS está inactivo.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: CATALOGO_PADRE_INACTIVO
                      mensaje: El catálogo padre PAIS está inactivo.
                FECHA_VIGENCIA_VENCIDA:
                  summary: E-16 · FECHA_VIGENCIA_VENCIDA
                  value:
                    codigo: FECHA_VIGENCIA_VENCIDA
                    mensaje: Debe actualizar la fecha de vigencia final.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: FECHA_VIGENCIA_VENCIDA
                      mensaje: Debe actualizar la fecha de vigencia final.
                CONFIRMACION_CAMBIO_PADRE_REQUERIDA:
                  summary: S-04 · CONFIRMACION_CAMBIO_PADRE_REQUERIDA
                  value:
                    codigo: CONFIRMACION_CAMBIO_PADRE_REQUERIDA
                    mensaje: 'El catálogo DEPTO tiene registros: confirme el cambio de padre y revise los ids de registro
                      padre.'
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: confirmParentChange
                      codigo: CONFIRMACION_CAMBIO_PADRE_REQUERIDA
                      mensaje: 'El catálogo DEPTO tiene registros: confirme el cambio de padre y revise los ids de registro
                        padre.'
        '422':
          description: 'La solicitud es válida según el esquema pero viola una regla de negocio. Códigos: `CATALOGO_PADRE_INEXISTENTE`
            (E-06), `JERARQUIA_CICLICA` (E-08), `VIGENCIA_INVALIDA` (E-09), `CODIGO_CATALOGO_INMUTABLE` (E-11).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATALOGO_PADRE_INEXISTENTE:
                  summary: E-06 · CATALOGO_PADRE_INEXISTENTE
                  value:
                    codigo: CATALOGO_PADRE_INEXISTENTE
                    mensaje: El catálogo padre NOEXISTE no existe.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: CATALOGO_PADRE_INEXISTENTE
                      mensaje: El catálogo padre NOEXISTE no existe.
                JERARQUIA_CICLICA:
                  summary: E-08 · JERARQUIA_CICLICA
                  value:
                    codigo: JERARQUIA_CICLICA
                    mensaje: La relación padre-hijo genera un ciclo.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: parent
                      codigo: JERARQUIA_CICLICA
                      mensaje: La relación padre-hijo genera un ciclo.
                VIGENCIA_INVALIDA:
                  summary: E-09 · VIGENCIA_INVALIDA
                  value:
                    codigo: VIGENCIA_INVALIDA
                    mensaje: Rango de vigencia inválido.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: VIGENCIA_INVALIDA
                      mensaje: Rango de vigencia inválido.
                CODIGO_CATALOGO_INMUTABLE:
                  summary: E-11 · CODIGO_CATALOGO_INMUTABLE
                  value:
                    codigo: CODIGO_CATALOGO_INMUTABLE
                    mensaje: El código del catálogo no es modificable.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: code
                      codigo: CODIGO_CATALOGO_INMUTABLE
                      mensaje: El código del catálogo no es modificable.
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - AdministracionCatalogos
      operationId: eliminarCatalogo
      summary: Eliminar un catálogo (no permitido)
      description: |
        RN-13. Declarada solo para dar respuesta contractual a la solicitud de eliminación: siempre
        responde 405 (E-24). El backend no implementa borrado físico.
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-07
        features:
        - CU-ADM-01-inactivar-catalogo.feature
        reglas:
        - RN-13
        excepciones:
        - E-24
        - E-25
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: 'Operación no permitida. Códigos: `ELIMINACION_NO_PERMITIDA` (E-24).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ELIMINACION_NO_PERMITIDA:
                  summary: E-24 · ELIMINACION_NO_PERMITIDA
                  value:
                    codigo: ELIMINACION_NO_PERMITIDA
                    mensaje: 'Operación no permitida: solo se admite la inactivación.'
                    timestamp: '2026-10-04T10:00:00Z'

        - CU-ADM-01-actualizar-registro.feature
        reglas:
        - RN-11
        - RN-18
        excepciones:
        - E-10
        - E-14
        - E-19
        - E-21
        - E-22
        - E-25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRecordUpdateRequest'
      responses:

                  summary: E-14 · VALOR_CAMPO_INVALIDO
                  value:
                    codigo: VALOR_CAMPO_INVALIDO
                    mensaje: El valor -5 no es válido para el campo poblacion (NUMERIC{0:2000000000}).
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: values[3].valor
                      codigo: VALOR_CAMPO_INVALIDO
                      mensaje: El valor -5 no es válido para el campo poblacion (NUMERIC{0:2000000000}).
                CAMPO_KEY_INMUTABLE:
                  summary: E-19 · CAMPO_KEY_INMUTABLE
                  value:
                    codigo: CAMPO_KEY_INMUTABLE
                    mensaje: El campo llave no es modificable.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: values[0].field
                      codigo: CAMPO_KEY_INMUTABLE
                      mensaje: El campo llave no es modificable.
                CAMPO_INEXISTENTE:
                  summary: E-21 · CAMPO_INEXISTENTE
                  value:
                    codigo: CAMPO_INEXISTENTE
                    mensaje: El campo moneda no está definido en el catálogo PAIS.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields
                      codigo: CAMPO_INEXISTENTE
                      mensaje: El campo moneda no está definido en el catálogo PAIS.
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:

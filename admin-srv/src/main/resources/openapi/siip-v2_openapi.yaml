  /catalogos/{code}/registros/{keyValue}/inactivaciones:
    parameters:
    - $ref: '#/components/parameters/CatalogCode'
    - $ref: '#/components/parameters/KeyValue'
    post:
      tags:
      - AdministracionCatalogos
      operationId: inactivarRegistro
      summary: Inactivar un registro
      description: |
        SF-09. Sin `toDate`: `active = INACTIVE` y `toDate` = fecha actual (RN-12a). Con `toDate` hoy o
        pasada: queda `INACTIVE` (RN-12b, RN-16). Cascada recursiva a los registros hijos (RN-14).
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-11
        features:
        - CU-ADM-01-inactivar-registro.feature
        reglas:
        - RN-12
        - RN-14
        - RN-16
        excepciones:
        - E-09
        - E-10
        - E-22
        - E-25
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InactivationRequest'
      responses:
        '200':
          description: Registro inactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogOrRecordNotFound'
        '422':
          description: 'La solicitud es válida según el esquema pero viola una regla de negocio. Códigos: `VIGENCIA_INVALIDA`
            (E-09), `FECHA_INACTIVACION_FUTURA` (sin código en el CU).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VIGENCIA_INVALIDA:
                  summary: E-09 · VIGENCIA_INVALIDA
                  value:
                    codigo: VIGENCIA_INVALIDA
                    mensaje: Rango de vigencia inválido.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: VIGENCIA_INVALIDA
                      mensaje: Rango de vigencia inválido.
                FECHA_INACTIVACION_FUTURA:
                  summary: contrato · FECHA_INACTIVACION_FUTURA
                  value:
                    codigo: FECHA_INACTIVACION_FUTURA
                    mensaje: La fecha de inactivación debe ser la fecha actual o una fecha pasada.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: FECHA_INACTIVACION_FUTURA
                      mensaje: La fecha de inactivación debe ser la fecha actual o una fecha pasada.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalogos/{code}/registros/{keyValue}/reactivaciones:
    parameters:
    - $ref: '#/components/parameters/CatalogCode'
    - $ref: '#/components/parameters/KeyValue'
    post:
      tags:
      - AdministracionCatalogos
      operationId: reactivarRegistro
      summary: Reactivar un registro
      description: |
        SF-09 paso 4. Exige catálogo `ACTIVE` y, si tiene padre, registro padre `ACTIVE` (E-20); `toDate`
        vacía o futura (E-16). Los registros hijos conservan su estado (S-03).
      security:
      - bearerAuth: []
      x-roles:
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-11
        features:
        - CU-ADM-01-inactivar-registro.feature
        reglas:
        - RN-14
        excepciones:
        - E-09
        - E-10
        - E-16
        - E-20
        - E-22
        - E-25
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivationRequest'
      responses:
        '200':
          description: Registro reactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CatalogOrRecordNotFound'
        '409':
          description: 'El estado actual del recurso impide la operación. Códigos: `REGISTRO_PADRE_O_CATALOGO_INACTIVO` (E-20).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                REGISTRO_PADRE_O_CATALOGO_INACTIVO:
                  summary: E-20 · REGISTRO_PADRE_O_CATALOGO_INACTIVO
                  value:
                    codigo: REGISTRO_PADRE_O_CATALOGO_INACTIVO
                    mensaje: 'No se puede reactivar: el catálogo o registro padre está inactivo.'
                    timestamp: '2026-10-04T10:00:00Z'
        '422':
          description: 'La solicitud es válida según el esquema pero viola una regla de negocio. Códigos: `VIGENCIA_INVALIDA`
            (E-09), `FECHA_VIGENCIA_VENCIDA` (E-16).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VIGENCIA_INVALIDA:
                  summary: E-09 · VIGENCIA_INVALIDA
                  value:
                    codigo: VIGENCIA_INVALIDA
                    mensaje: Rango de vigencia inválido.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: VIGENCIA_INVALIDA
                      mensaje: Rango de vigencia inválido.
                FECHA_VIGENCIA_VENCIDA:
                  summary: E-16 · FECHA_VIGENCIA_VENCIDA
                  value:
                    codigo: FECHA_VIGENCIA_VENCIDA
                    mensaje: Debe actualizar la fecha de vigencia final.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: toDate
                      codigo: FECHA_VIGENCIA_VENCIDA
                      mensaje: Debe actualizar la fecha de vigencia final.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalogos/{code}/registros/{keyValue}/hijos:
    parameters:
    - $ref: '#/components/parameters/CatalogCode'
    - $ref: '#/components/parameters/KeyValue'
    get:
      tags:
      - AdministracionCatalogos
      operationId: consultarRegistrosHijos
      summary: Buscar los registros hijos de un registro padre
      description: |
        SF-13. `code` es el catálogo padre y `keyValue` el valor KEY del registro padre (E-22 si no existe).
        Retorna la estructura del CU: `argumento`, `codigoCatalogoPadre`, `codigoCatalogoHijo`, `fieldSet`
        (sobre el catálogo hijo, algoritmo 4.1) y `resultSet` con cada hijo y su estado. Si el catálogo
        padre no tiene hijo: `codigoCatalogoHijo = null`, `fieldSet` y `resultSet` vacíos (no es error).
      security:
      - bearerAuth: []
      x-roles:
      - USUARIO
      - SISTEMA_CONSUMIDOR
      - ADMINISTRADOR_DE_CATALOGOS
      x-trazabilidad:
        historias:
        - HU-ADM-01-15
        features:
        - CU-ADM-01-consultar-registros-hijos.feature
        reglas:
        - RN-24
        - RN-25
        excepciones:
        - E-10
        - E-21
        - E-22
      parameters:
      - $ref: '#/components/parameters/FieldNames'
      responses:
        '200':
          description: Registros hijos (resultSet posiblemente vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildRecordsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CatalogOrRecordNotFound'
        '422':
          description: 'La solicitud es válida según el esquema pero viola una regla de negocio. Códigos: `CAMPO_INEXISTENTE`
            (E-21).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CAMPO_INEXISTENTE:
                  summary: E-21 · CAMPO_INEXISTENTE
                  value:
                    codigo: CAMPO_INEXISTENTE
                    mensaje: El campo moneda no está definido en el catálogo PAIS.
                    timestamp: '2026-10-04T10:00:00Z'
                    detalles:
                    - campo: fields
                      codigo: CAMPO_INEXISTENTE
                      mensaje: El campo moneda no está definido en el catálogo PAIS.
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogCode:
      name: code
      in: path
      required: true
      description: Código del catálogo (`Catalog.code`).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    KeyValue:
      name: keyValue
      in: path
      required: true
      description: Valor del campo KEY del registro (`CatalogRecord.keyValue`).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    FieldNames:
      name: fields
      in: query
      required: false
      style: form
      explode: false
      description: 'Conjunto de campos, separados por coma (`?fields=continente,codPais`). Algoritmo 4.1 del CU: si se omite
        → KEY + primer campo no KEY de menor posición; si no incluye el KEY, se antepone; un campo no definido → E-21.'
      schema:
        type: array
        items:
          type: string
          maxLength: 128
    CatalogCodeQuery:
      name: code
      in: query
      required: false
      description: Busca el catálogo con este código (RN-09).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    CatalogNameQuery:
      name: name
      in: query
      required: false
      description: Busca los catálogos con este nombre (RN-09). Comparación sin distinguir mayúsculas (pendiente de confirmar
        en el CU).
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    BadRequest:
      description: 'Solicitud mal formada o que no cumple el esquema. Código: `SOLICITUD_INVALIDA`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Token ausente, inválido o expirado. Código: `NO_AUTENTICADO`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'El usuario no tiene el rol Administrador de Catálogos. Código: `SIN_PERMISOS` (E-25).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SIN_PERMISOS:
              summary: E-25 · SIN_PERMISOS
              value:
                codigo: SIN_PERMISOS
                mensaje: No tiene permisos para modificar catálogos o registros.
                timestamp: '2026-10-04T10:00:00Z'
    CatalogNotFound:
      description: 'El catálogo de la ruta no existe. Código: `CATALOGO_INEXISTENTE` (E-10).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            CATALOGO_INEXISTENTE:
              summary: E-10 · CATALOGO_INEXISTENTE
              value:
                codigo: CATALOGO_INEXISTENTE
                mensaje: El catálogo XYZ no existe.
                timestamp: '2026-10-04T10:00:00Z'
                detalles:
                - campo: code
                  codigo: CATALOGO_INEXISTENTE
                  mensaje: El catálogo XYZ no existe.
    CatalogOrRecordNotFound:
      description: 'El catálogo o el registro de la ruta no existe. Códigos: `CATALOGO_INEXISTENTE` (E-10), `REGISTRO_INEXISTENTE`
        (E-22).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            CATALOGO_INEXISTENTE:
              summary: E-10 · CATALOGO_INEXISTENTE
              value:
                codigo: CATALOGO_INEXISTENTE
                mensaje: El catálogo XYZ no existe.
                timestamp: '2026-10-04T10:00:00Z'
                detalles:
                - campo: code
                  codigo: CATALOGO_INEXISTENTE
                  mensaje: El catálogo XYZ no existe.
            REGISTRO_INEXISTENTE:
              summary: E-22 · REGISTRO_INEXISTENTE
              value:
                codigo: REGISTRO_INEXISTENTE
                mensaje: No existe un registro con la llave ZZZ.
                timestamp: '2026-10-04T10:00:00Z'
                detalles:
                - campo: keyValue
                  codigo: REGISTRO_INEXISTENTE
                  mensaje: No existe un registro con la llave ZZZ.
    InternalServerError:
      description: 'Error no controlado. Código: `ERROR_INTERNO`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Esquema único de error del proyecto SIIP v2, usado en todas las respuestas 4xx/5xx.
      required:
      - codigo
      - mensaje
      - timestamp
      properties:
        codigo:
          type: string
          description: Código de error estable, en MAYÚSCULAS_CON_GUION_BAJO. Su equivalencia con los códigos del CU (E-xx)
            está en `info.x-codigos-error`.
          example: CATALOGO_INEXISTENTE
        mensaje:
          type: string
          description: Mensaje legible para el usuario. Para los errores del CU es el texto de la sección 9.
        timestamp:
          type: string
          format: date-time
        detalles:
          type: array
          description: Detalles opcionales (campo afectado, valor, operación alternativa).
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
      - mensaje
      properties:
        campo:
          type: string
          description: Ruta de la propiedad o parámetro afectado (ej. `fields[2].name`, `parentRecord`).
        codigo:
          type: string
        mensaje:
          type: string
    ActiveStatus:
      type: string
      description: Estado de un Catalog o CatalogRecord (RN-01, RN-12, RN-15, RN-16).
      enum:
      - ACTIVE
      - INACTIVE
    FieldQualifier:
      type: string
      description: 'Cabecera de un campo: llave o campo común (RN-03).'
      enum:
      - KEY
      - FIELD
    FieldType:
      type: string
      description: Tipo de un campo (RN-04).
      enum:
      - NUMERIC
      - STRING
      - FECHA
      - ENUM
    CatalogCreateRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - fields
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Código único (E-01) e inmutable del catálogo.
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent:
          type: string
          maxLength: 64
          nullable: true
          description: Código del catálogo padre (opcional). Debe existir (E-06), estar activo (E-15) y no tener ya un hijo
            (E-07).
        active:
          allOf:
          - $ref: '#/components/schemas/ActiveStatus'
          default: ACTIVE
          description: Estado solicitado. Una `toDate` hoy o pasada prevalece y deja el catálogo `INACTIVE` (S-02).
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
          description: TO DATE. Hoy o pasada → el catálogo se crea `INACTIVE` (RN-16).
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldRequest'
          description: Al menos un campo (E-02) y exactamente un KEY (E-03, E-23); se validan en el dominio y se reportan
            con 422.
    CatalogDescriptorsUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Actualización parcial de descriptores; solo se modifican las propiedades presentes (RN-19).
      properties:
        code:
          type: string
          maxLength: 64
          description: No modificable (RN-19). Si se envía con un valor distinto al de la ruta → 422 `CODIGO_CATALOGO_INMUTABLE`
            (E-11).
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent:
          type: string
          maxLength: 64
          nullable: true
          description: Código del nuevo catálogo padre, o `null` para dejar el catálogo plano (SF-15).
        active:
          $ref: '#/components/schemas/ActiveStatus'
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
        confirmParentChange:
          type: boolean
          default: false
          description: Confirmación requerida para cambiar el padre de un catálogo con registros (S-04).
    CatalogFieldsUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - fields
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldRequest'
          description: Lista completa de campos que reemplaza a la actual.
    CatalogFieldRequest:
      type: object
      additionalProperties: false
      description: 'Definición de un campo (gramática: `field : head name type posicion`). Solo se informan los parámetros
        del `fieldType` declarado (E-05).'
      required:
      - name
      - qualifier
      - posicion
      - fieldType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        qualifier:
          $ref: '#/components/schemas/FieldQualifier'
        posicion:
          type: integer
          format: int32
          minimum: 1
          description: Entero positivo y único dentro del catálogo (S-05).
        fieldType:
          $ref: '#/components/schemas/FieldType'
        minValue:
          type: number
          nullable: true
          description: 'NUMERIC {mínimo : …}. Solo para NUMERIC.'
        maxValue:
          type: number
          nullable: true
          description: 'NUMERIC {… : máximo}. Solo para NUMERIC.'
        maxLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 4000
          nullable: true
          description: STRING {n}. Solo para STRING. Para el campo KEY, máximo 255 (modelo de dominio v3.0).
        minDate:
          type: string
          format: date
          nullable: true
          description: 'FECHA {desde : …}. Solo para FECHA.'
        maxDate:
          type: string
          format: date
          nullable: true
          description: 'FECHA {… : hasta}. Solo para FECHA.'
        enumValues:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 255
          description: 'ENUM {s1, s2, …}: lista no vacía y sin duplicados. Solo para ENUM.'
    CatalogFieldResponse:
      type: object
      required:
      - name
      - qualifier
      - posicion
      - fieldType
      properties:
        name:
          type: string
        qualifier:
          $ref: '#/components/schemas/FieldQualifier'
        posicion:
          type: integer
          format: int32
          minimum: 1
        fieldType:
          $ref: '#/components/schemas/FieldType'
        minValue:
          type: number
          nullable: true
          description: 'NUMERIC {mínimo : …}. Solo para NUMERIC.'
        maxValue:
          type: number
          nullable: true
          description: 'NUMERIC {… : máximo}. Solo para NUMERIC.'
        maxLength:
          type: integer
          format: int32
          minimum: 1
          maximum: 4000
          nullable: true
          description: STRING {n}. Solo para STRING. Para el campo KEY, máximo 255 (modelo de dominio v3.0).
        minDate:
          type: string
          format: date
          nullable: true
          description: 'FECHA {desde : …}. Solo para FECHA.'
        maxDate:
          type: string
          format: date
          nullable: true
          description: 'FECHA {… : hasta}. Solo para FECHA.'
        enumValues:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 255
          description: 'ENUM {s1, s2, …}: lista no vacía y sin duplicados. Solo para ENUM.'
    CatalogResponse:
      type: object
      description: Definición completa de un catálogo (SF-02).
      required:
      - code
      - name
      - active
      - fields
      properties:
        code:
          type: string
        name:
          type: string
        parent:
          type: string
          nullable: true
          description: Código del catálogo padre, o `null`.
        child:
          type: string
          nullable: true
          description: 'Código del catálogo hijo, o `null` (RN-05: como máximo uno).'
        active:
          $ref: '#/components/schemas/ActiveStatus'
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
        fields:
          type: array
          description: Ordenados por `posicion`.
          items:
            $ref: '#/components/schemas/CatalogFieldResponse'
    CatalogSummaryResponse:
      type: object
      description: Elemento del listado de catálogos (sin campos).
      required:
      - code
      - name
      - active
      properties:
        code:
          type: string
        name:
          type: string
        parent:
          type: string
          nullable: true
        child:
          type: string
          nullable: true
        active:
          $ref: '#/components/schemas/ActiveStatus'
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
    InactivationRequest:
      type: object
      additionalProperties: false
      description: Cuerpo opcional. Sin `toDate` aplica RN-12a (INACTIVE + toDate = hoy); con `toDate` (hoy o pasada) aplica
        RN-12b.
      properties:
        toDate:
          type: string
          format: date
    ReactivationRequest:
      type: object
      additionalProperties: false
      description: Cuerpo opcional. `toDate` ausente o `null` limpia la TO DATE; si se informa debe ser futura (E-16).
      properties:
        toDate:
          type: string
          format: date
          nullable: true
    CatalogRecordValueRequest:
      type: object
      additionalProperties: false
      required:
      - field
      - valor
      properties:
        field:
          type: string
          minLength: 1
          description: Nombre del campo (`CatalogField.name`).
        valor:
          type: string
          maxLength: 4000
          description: Valor en versión STRING (RN-11). Fechas en ISO-8601.
    CatalogRecordValueResponse:
      type: object
      required:
      - field
      - qualifier
      - valor
      properties:
        field:
          type: string
        qualifier:
          $ref: '#/components/schemas/FieldQualifier'
        valor:
          type: string
    CatalogRecordCreateRequest:
      type: object
      additionalProperties: false
      required:
      - values
      properties:
        parentRecord:
          type: string
          maxLength: 255
          nullable: true
          description: Valor KEY del registro padre en el catálogo padre. Obligatorio si el catálogo tiene padre; prohibido
            si es plano (E-18).
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CatalogRecordValueRequest'
          description: Un valor por cada campo definido, incluido el KEY (RN-01, RN-11).
    CatalogRecordUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - values
      properties:
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CatalogRecordValueRequest'
          description: Nuevos valores de campos no KEY (RN-18).
    CatalogRecordResponse:
      type: object
      description: Registro completo de un catálogo.
      required:
      - catalog
      - keyValue
      - active
      - values
      properties:
        catalog:
          type: string
          description: Código del catálogo del registro.
        keyValue:
          type: string
          description: Valor del campo KEY (`CatalogRecord.keyValue`).
        parentRecord:
          type: string
          nullable: true
          description: Valor KEY del registro padre, o `null`.
        active:
          $ref: '#/components/schemas/ActiveStatus'
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
        values:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRecordValueResponse'
    ResultRow:
      type: object
      description: 'Elemento del Result Set: valores en el orden del Field Set y estado del registro.'
      required:
      - valores
      - estado
      properties:
        valores:
          type: array
          items:
            type: string
            nullable: true
        estado:
          $ref: '#/components/schemas/ActiveStatus'
    KeySearchResult:
      type: object
      description: Resultado de SF-10 (estructura literal del CU).
      required:
      - argumentoBusqueda
      - codigoCatalogo
      - fieldSet
      - resultSet
      properties:
        argumentoBusqueda:
          type: string
        codigoCatalogo:
          type: string
        fieldSet:
          type: array
          items:
            type: string
        resultSet:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/ResultRow'
      example:
        argumentoBusqueda: COL
        codigoCatalogo: PAIS
        fieldSet:
        - codPais
        - nombre
        resultSet:
        - valores:
          - COL
          - Colombia
          estado: ACTIVE
    CatalogRecordsResult:
      type: object
      description: Resultado de SF-11 (estructura literal del CU).
      required:
      - codigoCatalogo
      - fieldSet
      - resultSet
      properties:
        codigoCatalogo:
          type: string
        fieldSet:
          type: array
          items:
            type: string
        resultSet:
          type: array
          items:
            $ref: '#/components/schemas/ResultRow'
      example:
        codigoCatalogo: PAIS
        fieldSet:
        - codPais
        - nombre
        resultSet:
        - valores:
          - COL
          - Colombia
          estado: ACTIVE
        - valores:
          - ESP
          - España
          estado: INACTIVE
    ChildCatalogResult:
      type: object
      description: 'Resultado de SF-12: catálogo hijo `{codigo, nombre}` (estructura literal del CU).'
      required:
      - codigo
      - nombre
      properties:
        codigo:
          type: string
        nombre:
          type: string
      example:
        codigo: DEPTO
        nombre: Departamentos
    ChildRecordsResult:
      type: object
      description: Resultado de SF-13 (estructura literal del CU).
      required:
      - argumento
      - codigoCatalogoPadre
      - codigoCatalogoHijo
      - fieldSet
      - resultSet
      properties:
        argumento:
          type: string
        codigoCatalogoPadre:
          type: string
        codigoCatalogoHijo:
          type: string
          nullable: true
        fieldSet:
          type: array
          items:
            type: string
        resultSet:
          type: array
          items:
            $ref: '#/components/schemas/ResultRow'
      example:
        argumento: COL
        codigoCatalogoPadre: PAIS
        codigoCatalogoHijo: DEPTO
        fieldSet:
        - codDepto
        - nombre
        resultSet:
        - valores:
          - ANT
          - Antioquia
          estado: ACTIVE

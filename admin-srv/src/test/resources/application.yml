spring:
  application:
    name: dgicp-siip-admin-srv

  # H2 en memoria: las pruebas (BDD de CU-ADM-01 incluidas) crean el esquema desde las
  # entidades. Fuera de las pruebas el esquema lo crean los scripts de sql/ (ddl-auto: none).
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    # Igual que en src/main: java.time directo al driver (fechas anteriores a 1582).
    properties:
      hibernate:
        type:
          java_time_use_direct_jdbc: true

  # Security - mock OIDC for tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:0/mock-oidc

# Service Configuration
service:
  name: demo-test

# Actuator for tests
management:
  endpoints:
    web:
      exposure:
        include: health

# Logging - reduced for tests
logging:
  level:
    root: WARN
    sv.gob.mh: INFO

services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: siip-back
    # Sin puerto publicado al host: back no tiene seguridad propia (confía en
    # api-gateway/Keycloak), así que solo debe ser alcanzable dentro de microred.
    expose:
      - "8081"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: ${DB_URL}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      DB_SCHEMA: ${DB_SCHEMA}
      GATEWAY_URL: ${GATEWAY_URL}
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - microred
    depends_on:
      postgres:
          condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_EXTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - back
      - keycloak
    networks: 
      - microred

  front:
     build:
       context: ./front
       dockerfile: Dockerfile
     container_name: siip-front
     environment:
       GATEWAY_URL: ${GATEWAY_INTERNAL_URL}
     ports:
       - "80:8080"
     depends_on:
       - api-gateway
     networks:
       - microred

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    container_name: siip-db
    ports:
      - "5432:5432"
    volumes:
      - siip_pgdata:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"] # Comando para verificar la salud
      interval: 5s       # Cada cuánto se ejecuta el test
      timeout: 5s        # Cuánto tiempo espera el test antes de considerar un fallo
      retries: 5         # Cuántos fallos consecutivos antes de marcar el contenedor como no saludable
      start_period: 10s  # Período inicial para que PostgreSQL arranque y se inicialice
    networks:
      - microred

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "8085:8080"
    depends_on:
      - postgres
    networks:
      - microred
      
networks:
  microred:

volumes:
  siip_pgdata:
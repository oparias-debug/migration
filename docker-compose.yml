services:
  # Mismo nombre que el Service de Kubernetes en la entidad (backend-srv-config), así
  # api-gateway resuelve el mismo host en local y en los ambientes.
  backend-srv:
    build:
      context: ./backend-srv
      dockerfile: Dockerfile.local
    container_name: siip-backend-srv
    # Sin puerto publicado al host: se llega por api-gateway (/back/**).
    expose:
      - "8081"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: ${DB_URL}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      DB_SCHEMA: ${DB_SCHEMA}
      GATEWAY_URL: ${GATEWAY_URL}
      SPRING_PROFILES_ACTIVE: dev
      # Valida el JWT que reenvía api-gateway contra el Keycloak local, como admin-srv.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    networks:
      - microred
    depends_on:
      postgres:
          condition: service_healthy

  # admin-srv y siipsafi-srv son plantillas del marco DINAFI pensadas para Oracle y para los
  # servicios del MH (config server, authorization-service, logger remoto). En local se
  # redirigen con variables SPRING_* sin tocar su application.yml: Postgres en lugar de
  # Oracle y el Keycloak local como emisor de tokens. Igual que backend-srv, sin puerto
  # publicado: se llega a ellos por api-gateway (/admin/**, /siipsafi/**).
  admin-srv:
    build:
      context: ./admin-srv
      dockerfile: Dockerfile.local
    container_name: siip-admin-srv
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # Las tablas de CU-ADM-01 (catálogos) y CU-ADM-04 (calendarios) no las crea Hibernate: en la
      # entidad, los scripts Oracle de admin-srv/sql; en local, admin-srv-init antes del primer
      # arranque, junto con la carga inicial de catálogos. validate solo comprueba que coincidan con
      # las entidades, así que los datos sobreviven a los reinicios de admin-srv.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Misma plantilla que siipsafi-srv: ver los comentarios de ese servicio.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      CONFIG_SERVICE_URL: ""
      REMOTE_LOGGER_ENABLED: "false"
    networks:
      - microred
    depends_on:
      admin-srv-init:
        condition: service_completed_successfully

  # Esquema de admin-srv y carga inicial de catálogos en la base local. Corre y termina antes de
  # cada arranque de admin-srv, pero solo actúa la primera vez (cuando catalogo está vacío); en los
  # siguientes sale sin tocar nada. Ver postgresql/init-catalogos.sh.
  admin-srv-init:
    image: postgres:17
    container_name: siip-admin-srv-init
    entrypoint: ["bash", "/init-catalogos.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
    volumes:
      - ./postgresql/init-catalogos.sh:/init-catalogos.sh:ro
      - ./admin-srv/sql:/admin-srv-sql:ro
    restart: "no"
    networks:
      - microred
    depends_on:
      postgres:
        condition: service_healthy

  siipsafi-srv:
    build:
      context: ./siipsafi-srv
      dockerfile: Dockerfile.local
    container_name: siip-siipsafi-srv
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # Su application.yml arma el issuer con https:// fijo; aquí se reemplazan los dos.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      # Vacío = ExternalConfigSource no llama al config server del MH.
      CONFIG_SERVICE_URL: ""
      REMOTE_LOGGER_ENABLED: "false"
      # AUTHZ_SERVICE_URL queda en el default del MH, inalcanzable sin VPN: los endpoints con
      # @PermissionsAllowed responden 403 (el marco falla cerrado).
    networks:
      - microred
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_EXTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - backend-srv
      - admin-srv
      - siipsafi-srv
      - keycloak
    networks: 
      - microred

  # Compila el front (npm ci + npm run build -> front/dist/) sin necesitar Node en el host. front/Dockerfile solo empaqueta un dist/ ya compilado (en la entidad lo
  # compila el pipeline Tekton), y "up --build" construye las imágenes ANTES de levantar
  # cualquier contenedor, así que esto va como paso previo, no como dependencia de front:
  #   docker compose run --rm front-build
  #   docker compose up -d --build front
  # Con profile propio para que "docker compose up" no lo levante solo.
  front-build:
    profiles: ["build"]
    build:
      context: ./front
      # Misma situación que el pipeline de la entidad: Node sin Java. src/api/generated/ va
      # versionado, así que npm run build no necesita openapi-generator-cli.
      dockerfile_inline: |
        FROM registry.access.redhat.com/ubi9/nodejs-22@sha256:510a73eeff392500e22eadf976686dbd16c27eaa1a8808f8f51b29fec950f68c
        # El volumen anónimo de node_modules (abajo) hereda dueño y permisos de esta carpeta;
        # sin crearla aquí nace de root y npm ci (usuario 1001) no puede escribir.
        USER root
        RUN mkdir -p /opt/app-root/src/node_modules && chown 1001:0 /opt/app-root/src/node_modules
        USER 1001
    working_dir: /opt/app-root/src
    environment:
      # En esta imagen HOME = /opt/app-root/src, que es el bind mount: sin esto la caché de
      # npm termina en front/.npm del host.
      npm_config_cache: /tmp/.npm
    command: ["bash", "-c", "npm ci && npm run build"]
    volumes:
      - ./front:/opt/app-root/src
      # node_modules propio del contenedor (binarios Linux): no pisa el del host.
      - /opt/app-root/src/node_modules

  front:
     build:
       context: ./front
       dockerfile: Dockerfile
     container_name: siip-front
     environment:
       GATEWAY_URL: ${GATEWAY_INTERNAL_URL}
     ports:
       - "80:8080"
     depends_on:
       - api-gateway
     networks:
       - microred

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    container_name: siip-db
    ports:
      - "5432:5432"
    volumes:
      - siip_pgdata:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"] # Comando para verificar la salud
      interval: 5s       # Cada cuánto se ejecuta el test
      timeout: 5s        # Cuánto tiempo espera el test antes de considerar un fallo
      retries: 5         # Cuántos fallos consecutivos antes de marcar el contenedor como no saludable
      start_period: 10s  # Período inicial para que PostgreSQL arranque y se inicialice
    networks:
      - microred

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "8085:8080"
    depends_on:
      - postgres
    networks:
      - microred

  # Base de datos propia de SonarQube (no reutiliza siip-db: Sonar exige su propio
  # usuario/esquema y su ciclo de vida no debe acoplarse al de la base de negocio).
  sonarqube-db:
    image: postgres:17
    container_name: siip-sonarqube-db
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      POSTGRES_DB: ${SONARQUBE_DB_DATABASE}
    volumes:
      - siip_sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microred

  # Servidor SonarQube (análisis estático + cobertura). Ver REFERENCE.md#sonarqube-local
  # para cómo correr el análisis de backend-srv/api-gateway (Maven) y front (npm) contra este servidor.
  sonarqube:
    image: sonarqube:community
    container_name: siip-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_DATABASE}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - siip_sonarqube_data:/opt/sonarqube/data
      - siip_sonarqube_extensions:/opt/sonarqube/extensions
      - siip_sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - microred

  # Carga en el Sonar local el perfil de reglas y el quality gate de la entidad
  # (sonar/reglas-entidad.json), los deja como default y verifica que quedaron bien.
  # Corre una vez y termina; volver a correrlo tras editar el JSON:
  #   docker compose up sonarqube-init
  sonarqube-init:
    image: python:3.12-alpine
    container_name: siip-sonarqube-init
    environment:
      SONAR_URL: http://sonarqube:9000
      SONAR_ADMIN_USER: ${SONAR_ADMIN_USER:-admin}
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-}
      SONAR_ADMIN_TOKEN: ${SONAR_ADMIN_TOKEN:-}
    volumes:
      - ./sonar:/sonar:ro
    command: ["python", "-u", "/sonar/aplicar-reglas-entidad.py"]
    restart: "no"
    depends_on:
      - sonarqube
    networks:
      - microred

networks:
  microred:

volumes:
  siip_pgdata:
  siip_sonarqube_db_data:
  siip_sonarqube_data:
  siip_sonarqube_extensions:
  siip_sonarqube_logs:
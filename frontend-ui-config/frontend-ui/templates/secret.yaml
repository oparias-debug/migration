apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend-ui.fullname" . }}-secret
  labels:
    {{- include "frontend-ui.labels" . | nindent 4 }}
type: Opaque
# Nace VACIO a proposito: NO debe haber secretos en git (lo validan los agentes de seguridad).
# El usuario carga SUS variables por ambiente directamente en el cluster (oc edit secret / consola).
# ArgoCD ignora /data (ignoreDifferences en el ApplicationSet, ver create-argocd-app) para NO
# revertir esas ediciones. El -cmp (no sensible) sigue en el chart; aca solo lo sensible, vacio.

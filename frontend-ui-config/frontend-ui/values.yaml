# Default values for authentication-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: "quay-registry-quay-quay-enterprise.apps.gcp-op-desa.cloud.mh.gob.sv/mh-dgicp-siip2/frontend-ui"
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets:
  - name: quay-credentials
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "frontend-ui"

containerPort: 8080

route:
  enabled: true
  name: frontend-ui
  prefix: "frontend-ui"
  # Vacios = OpenShift genera el host y sirve desde la raiz (comportamiento por
  # defecto, un hostname por aplicacion).
  # Para montar varias aplicaciones bajo un mismo origen —y que compartan la
  # sesion— fijar un host comun y el path de cada una:
  #   host: "apps.gcp-op-desa.cloud.mh.gob.sv"
  #   path: "/miapp"
  host: ""
  path: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Endurecimiento del pod. En OpenShift el SCC restricted-v2 ya impone casi todo esto,
# pero sin declararlo el chart no es portable ni auditable: no se puede demostrar que el
# contenedor no corre privilegiado sin ir a mirar el SCC del clúster.
#
# runAsNonRoot NO se declara aquí A PROPÓSITO. Exige que la imagen fije un USER
# NUMÉRICO: con un nombre (por ejemplo 'apache') el kubelet no puede comprobar que no
# sea root y se NIEGA a arrancar el contenedor. Como el SCC ya garantiza que no corre
# como root, declararlo aquí no añade seguridad real y sí puede tumbar un servicio.
# Se activa por servicio, cuando su imagen use un uid numérico; el ciclo avisa en cada
# CR si el USER del Dockerfile es un nombre.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem se deja FUERA a propósito: Quarkus y httpd necesitan escribir
  # en el directorio temporal. Activarlo exige montarlo como emptyDir, y eso es una
  # decisión por servicio y no un valor por defecto seguro: puesto aquí sin más, dejaría
  # los pods en CrashLoop.
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

envFrom:
  - configMapRef:
      name: frontend-ui-cmp
  # Load all variables from the Helm-managed ConfigMap


# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

# ── Probes ──────────────────────────────────────────────────────────────────
# OJO si la aplicacion se monta bajo una subruta (miembro de un conjunto): el
# contenido queda en /var/www/html<BASE_PATH>, asi que `/` devuelve 404 y el
# liveness mata el pod en bucle. La Route responde 503 y parece un problema de
# red, cuando en realidad no hay pods listos.
#
# Los tres paths tienen que llevar el mismo prefijo que FRMK_BASE_PATH:
#   path: /miapp/
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 6
  timeoutSeconds: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# ConfigMap configuration
# This creates a ConfigMap named: <release-name>-config
# Example: if release name is "myapp", ConfigMap will be "myapp-config"
configMap:
  # Enable/disable ConfigMap creation
  enabled: true
  # Annotations for the ConfigMap
  annotations: {}
    # example.com/managed-by: "helm"
  # Data to include in the ConfigMap (key-value pairs)
  data:
    # Framework service URLs (example values)
    # Estas URL alimentan el connect-src de la CSP: son los unicos destinos a los que
    # la aplicacion puede hablar. Si falta uno, la llamada se bloquea en el navegador.
    # CSP_EXTRA_CONNECT admite origenes adicionales separados por espacio.
    CONFIG_SERVICE_URL: "inventario-service-mh-dev-dinafi-usi-frmk.apps.gcp-op-desa.cloud.mh.gob.sv"
    # OJO: es el Keycloak donde el scaffolder CREA el cliente OIDC de la aplicacion
    # (secret `developer-hub-secret`, clave `keycloak_url`), NO el del marco. Si aca se
    # pone otro, la CSP bloquea el intercambio del token y el login no funciona: la
    # aplicacion carga, devuelve 200 y se queda en la pantalla de acceso.
    KEYCLOAK_URL: "https://keycloak-mh-dev.apps.gcp-op-desa.cloud.mh.gob.sv"
    # El host del authentication-service: la aplicacion le pide el token y el
    # userinfo. Lo sabe por el config-server, pero Apache arma la CSP ANTES de que
    # el navegador lea nada, asi que hay que declararlo tambien aca y mantener los
    # dos valores iguales. Si falta, el intercambio del token queda bloqueado.
    AUTH_SERVICE_URL: "https://authentication-service-mh-dev-dinafi-usi-frmk.apps.gcp-op-desa.cloud.mh.gob.sv"
    CSP_EXTRA_CONNECT: ""
    # La CSP sale en modo BLOQUEO. Poner "true" SOLO para el ciclo de validacion de un
    # despliegue nuevo: reporta las violaciones en la consola del navegador y NO
    # protege. El arranque del pod lo avisa mientras este encendido, y hay que quitarlo
    # al terminar. Si aparecen violaciones legitimas, el origen que falte va en
    # CSP_EXTRA_CONNECT; nunca abrir a comodines.
    CSP_REPORT_ONLY: "false"
    AUTHZ_SERVICE_URL: "https://authorization-service-mh-dev-dinafi-usi-frmk.apps.gcp-op-desa.cloud.mh.gob.sv/api/v1/authz"
    AUDIT_SERVICE_URL: "https://auditoria-service-mh-dev-dinafi-usi-frmk.apps.gcp-op-desa.cloud.mh.gob.sv/api/v1/audit"
    LOG_SERVICE_URL: "https://auditoria-service-mh-dev-dinafi-usi-frmk.apps.gcp-op-desa.cloud.mh.gob.sv/api/v1/logs"
    # Composicion con el portal. Con estos valores la aplicacion es una SPA
    # autonoma en la raiz de su host, que es el comportamiento por defecto.
    # FRMK_BASE_PATH debe coincidir con el NEXT_PUBLIC_BASE_PATH usado al compilar.
    FRMK_BASE_PATH: ""
    # ── Conjunto de aplicaciones ────────────────────────────────────────────
    # Vacias = la aplicacion funciona SOLA, que es el comportamiento por defecto.
    #
    # Para que sea MIEMBRO de un conjunto se declara quien es la entrada. El rol se
    # deduce: si el entryComponentId coincide con el frontendId de esta aplicacion es
    # la ENTRADA, si no es MIEMBRO.
    #
    #   FRMK_ENTRY_COMPONENT_ID: "dgea-sim-requirement-ui"
    #   FRMK_ENTRY_URL: "/"
    #   FRMK_APP_URLS: "dgea-sim-report-ui=/reporte"
    #
    # FRMK_APP_URLS mapea cada aplicacion del conjunto a su ruta, para resolver los
    # enlaces del menu que apuntan a otra. Formato: "componentId=/ruta" separados por
    # espacio.
    FRMK_ENTRY_COMPONENT_ID: ""
    FRMK_ENTRY_URL: ""
    FRMK_APP_URLS: ""
    # Fuerza el rol (suelta | entrada | miembro)
    FRMK_ROLE: ""
    # Add your custom configuration key-value pairs here
    # APP_ENV: "production"
    # LOG_LEVEL: "info"


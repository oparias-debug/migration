sonar.projectKey=siip-front
sonar.projectName=SIIP - Frontend
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# src/api/generated no se versiona y se regenera desde los .yaml de openapi/ (ver REFERENCE.md);
# no tiene sentido analizarlo ni contarlo en cobertura.
sonar.exclusions=src/api/generated/**
sonar.coverage.exclusions=src/api/generated/**,src/main.tsx,src/vite-env.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

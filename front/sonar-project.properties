sonar.projectKey=dgicp-siip2-frontend-ui
sonar.projectName=dgicp-siip2-frontend-ui
sonar.projectVersion=1.0.0
# Servidor institucional por defecto. Para el SonarQube local (docker-compose.yml) se
# sobrescribe con la variable de entorno SONAR_HOST_URL=http://localhost:9000, que
# @sonar/scan y scripts/comprobar-quality-gate.mjs leen antes que este valor.
sonar.host.url=http://alcm.mh.gob.sv/e/sonar
sonar.sourceEncoding=UTF-8

# El Dockerfile entra en el analisis a proposito: el perfil SecDocker (43 reglas) esta
# activo en el servidor y sin esto no se aplica a nada.
sonar.sources=src,Dockerfile
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# src/api/generated es codigo generado desde los .yaml de openapi/ (se versiona solo porque el
# pipeline no tiene Java para regenerarlo, ver README.md); no tiene sentido analizarlo ni
# contarlo en cobertura.
sonar.exclusions=src/api/generated/**
# main.tsx (solo monta <App/>) y vite-env.d.ts (tipos) quedan fuera de cobertura, igual que
# en coverage.exclude de vite.config.ts, para que Sonar y la terminal den el mismo numero.
sonar.coverage.exclusions=src/api/generated/**,src/main.tsx,src/vite-env.d.ts

# Cobertura de Vitest (@vitest/coverage-v8, reporter 'lcov' en vite.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

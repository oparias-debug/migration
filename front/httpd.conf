# Configuracion de Apache HTTPD para la SPA (React + Vite).
# El Dockerfile la copia a /etc/httpd/conf.d/react.conf. La misma imagen corre en la
# entidad y en local (docker-compose.yml), asi que este es el unico servidor web del front.

# ── Proxy hacia api-gateway ─────────────────────────────────────────────────
#
# El navegador solo habla con este origen: /auth/** (login/refresh) y /back/**
# (API) se reenvian a api-gateway, que no expone CORS. ${GATEWAY_URL} lo expande
# httpd desde el entorno al arrancar (default en el Dockerfile, se sobrescribe en
# el ConfigMap). ProxyPass se resuelve antes que el <Directory> de abajo, asi que
# estas rutas nunca caen en el fallback a index.html.
ProxyRequests Off
ProxyPreserveHost On
<IfModule mod_headers.c>
    # Si ya viene de la Route (TLS terminado en el router) se respeta el valor.
    RequestHeader setifempty X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
</IfModule>
ProxyPass        "/auth/" "${GATEWAY_URL}/auth/"
ProxyPassReverse "/auth/" "${GATEWAY_URL}/auth/"
ProxyPass        "/back/" "${GATEWAY_URL}/back/"
ProxyPassReverse "/back/" "${GATEWAY_URL}/back/"

# ── Estaticos + fallback de la SPA ──────────────────────────────────────────
DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    # Cualquier otra ruta la resuelve React Router en el navegador.
    RewriteRule ^ /index.html [L]
</Directory>

# ServerTokens/ServerSignature son de ambito de servidor, no de vhost: van aqui
# porque conf.d se incluye a nivel de servidor. Sin esto la cabecera Server publica
# "Apache/2.4.62 ... OpenSSL/3.5.5", que le dice al atacante que CVE probar.
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # DENY, no SAMEORIGIN: tiene que decir lo mismo que `frame-ancestors 'none'` de
    # la CSP. Si discrepan, el resultado depende del navegador.
    Header always set X-Frame-Options "DENY"

    # Sin esto, un script inyectado puede pedir camara, microfono o ubicacion.
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # Aisla esta ventana de otras pestanas del mismo origen que pudieran abrirla.
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # HSTS: la Route termina TLS, pero sin esto el primer acceso por http:// es
    # interceptable. Sin `preload`: entrar a la lista es facil y salir no.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ── Content-Security-Policy (modo bloqueo) ──────────────────────────────
    #
    # connect-src 'self' alcanza: toda llamada del front (login, refresh, API) va a
    # /auth o /back de este mismo origen y el proxy de arriba la reenvia. El front no
    # habla directo con Keycloak.
    # style-src/font-src incluyen cdnjs y jsdelivr porque index.html carga de ahi
    # Font Awesome y Bootstrap Icons; si se pasan a npm, se quitan de aqui.
    # 'unsafe-inline' en style-src lo necesitan sweetalert2 y flatpickr (inyectan
    # estilos en linea). script-src no lo necesita: Vite no genera scripts en linea.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE application/xml application/xhtml+xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# index.html nunca se cachea (apunta a los bundles con hash del build nuevo); los
# bundles de dist/assets/ llevan hash en el nombre, asi que se pueden cachear largo.
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/html "access plus 0 seconds"
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType text/javascript "access plus 1 year"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
    ExpiresByType image/x-icon "access plus 1 month"
    ExpiresByType font/woff "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType font/ttf "access plus 1 year"
</IfModule>

FileETag None

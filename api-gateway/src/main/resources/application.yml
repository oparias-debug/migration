server:
  port: ${HTTP_PORT:8080}

spring:
  application:
    name: dgicp-siip2-api-gateway

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: swagger-ui
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/swagger-ui/oauth2-redirect.html"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${keycloak.internal-url}/realms/${KEYCLOAK_REALM}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${keycloak.internal-url}/realms/${KEYCLOAK_REALM}

  cloud:
    gateway:
      default-filters:
        - TokenRelay
      server.webflux.routes:
        # El prefijo público /back/** es contrato con front: no cambia aunque el servicio se
        # llame backend-srv. En la entidad: BACKEND_SRV_URL=http://backend-srv (Service, puerto 80).
        - id: backend-srv
          uri: ${BACKEND_SRV_URL:http://backend-srv:8081}
          predicates:
            - Path=/back/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/back/(?<segment>.*), /${segment}
        # Los tres servicios validan el JWT por su cuenta: TokenRelay (default-filters) les pasa
        # el token del cliente tal cual en Authorization.
        - id: admin-srv
          uri: ${ADMIN_SRV_URL:http://admin-srv:8080}
          predicates:
            - Path=/admin/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/admin/(?<segment>.*), /${segment}
        - id: siipsafi-srv
          uri: ${SIIPSAFI_SRV_URL:http://siipsafi-srv:8080}
          predicates:
            - Path=/siipsafi/**
          filters:
            - RemoveRequestHeader=Cookie
            - RewritePath=/siipsafi/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    oauth:
      client-id: swagger-ui
      use-pkce-with-authorization-code-grant: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: backend-srv
        url: /back/v3/api-docs
      - name: admin-srv
        url: /admin/v3/api-docs
      - name: siipsafi-srv
        url: /siipsafi/v3/api-docs

keycloak:
  internal-url: ${KEYCLOAK_INTERNAL_URL}  
  token-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

# Actuator: los probes de liveness/readiness del chart (api-gateway-config). A diferencia de
# los servicios internos, el gateway tiene Route pública: solo se expone health (sin detalles),
# y SecurityConfig lo deja pasar sin token.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

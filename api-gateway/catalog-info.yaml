# ═══════════════════════════════════════════════════════════════════════════
# Component — api-gateway (proyecto dgicp-siip2, como backend-srv, siipsafi-srv y frontend-ui).
# Derivado de backend-srv/catalog-info.yaml. Sin documento API: el gateway no tiene contrato
# propio (ver spec.dependsOn). admin-srv es el único servicio en dgicp-siip.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dgicp-siip2-api-gateway
  title: dgicp-siip2-api-gateway
  description: Punto de entrada HTTP de SIIP: enruta /back, /admin y /siipsafi y releva el JWT

  # Tags para clasificación y búsqueda
  tags:
    - spring-boot
    - dgicp
    - dgicp-siip2

  # Labels para metadata adicional
  labels:
    direction: dgicp
    project-tuleap: dgicp-siip2
    project-gerrit: api-gateway
    technology: spring-boot

  # Anotaciones con referencias a sistemas externos
  annotations:
    # Repositorios de código
    gerrit.mh.gob.sv/repo-app: dgicp-siip2/api-gateway
    gerrit.mh.gob.sv/repo-config: dgicp-siip2/api-gateway-config
    gerrit.mh.gob.sv/repo-ci: dgicp-microservicio/tekton

    # URLs de Gerrit
    gerrit.mh.gob.sv/app-url: http://almsrv2.mh.gob.sv:8081/admin/repos/dgicp-siip2/api-gateway
    gerrit.mh.gob.sv/config-url: http://almsrv2.mh.gob.sv:8081/admin/repos/dgicp-siip2/api-gateway-config

    # ArgoCD
    argocd/app-selector: backstage-argocd-selector=dgicp-siip2-api-gateway
    argocd/instance-name: gitops-server

    # Tekton
    janus-idp.io/tekton: dgicp-siip2-api-gateway

    # OpenShift
    openshift.io/app-name: dgicp-siip2-api-gateway

    backstage.io/kubernetes-id: dgicp-siip2-api-gateway
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=dgicp-siip2-api-gateway

    # Quay.io Registry
    quay.io/repository: mh-dgicp-siip2/api-gateway

    # SonarQube
    sonarqube.org/project-key: dgicp-siip2-api-gateway

    # Tuleap
    tuleap.org/project: dgicp-siip2

    # Backstage integrations — proxy catalog-srv (techdocs-ref gitiles para readTree; source-location api/v1)
    backstage.io/techdocs-ref: url:https://catalog-srv-gitiles-mh-dev-dinafi-usi-devhub.apps.gcp-op-desa.cloud.mh.gob.sv/gitiles/dgicp-siip2/api-gateway/+/refs/heads/dev/
    backstage.io/source-location: url:https://catalog-srv-mh-dev-dinafi-usi-devhub.apps.gcp-op-desa.cloud.mh.gob.sv/api/v1/dgicp-siip2/api-gateway/dev/

  # Enlaces a recursos y herramientas
  links:
    - url: https://api-gateway-mh-dev-dgicp-siip2.apps.gcp-op-desa.cloud.mh.gob.sv
      title: Aplicación en OpenShift
      icon: web
    - url: http://almsrv2.mh.gob.sv:8081/admin/repos/dgicp-siip2/api-gateway
      title: Repositorio Aplicación (Gerrit)
      icon: code
    - url: http://almsrv2.mh.gob.sv:8081/admin/repos/dgicp-siip2/api-gateway-config
      title: Repositorio Configuración (Gerrit)
      icon: settings
    - url: http://almsrv2.mh.gob.sv:8081/admin/repos/dgicp-microservicio/tekton
      title: Repositorio CI/CD (Gerrit)
      icon: build
    - url: https://openshift-gitops-server-openshift-gitops.apps.gcp-op-desa.cloud.mh.gob.sv/applications?labels=backstage-argocd-selector%3Ddgicp-siip2-api-gateway
      title: ArgoCD Application
      icon: dashboard
    - url: https://console-openshift-console.apps.gcp-op-desa.cloud.mh.gob.sv/k8s/cluster/projects/mh-dev-dgicp-siip2
      title: OpenShift Project
      icon: cloud
    - url: https://console-openshift-console.apps.gcp-op-desa.cloud.mh.gob.sv/topology/ns/mh-dev-dgicp-siip2
      title: OpenShift Topology
      icon: web
    - url: https://quay-registry-quay-quay-enterprise.apps.gcp-op-desa.cloud.mh.gob.sv/repository/mh-dgicp-siip2/api-gateway
      title: Quay Container Registry
      icon: storage
    - url: https://alcm.mh.gob.sv/projects/dgicp-siip2
      title: Proyecto Tuleap
      icon: web
    - url: http://el-dgicp-siip2.apps.gcp-op-desa.cloud.mh.gob.sv
      title: Tekton EventListener
      icon: webhook

# Especificación del componente
spec:
  type: service
  lifecycle: development
  owner: dgicp

  # Pertenencia a la aplicación (System) que representa el proyecto Tuleap
  system: dgicp-siip2

  # Sin providesApis: el gateway no tiene contrato OpenAPI propio, solo enruta los de los
  # servicios. Sus dependencias son los servicios a los que enruta (Service, ClusterIP).
  dependsOn:
    - component:dgicp-siip2-backend-srv
    - component:dgicp-siip-admin-srv
    - component:dgicp-siip2-siipsafi-srv

  # Información de la aplicación
  profile:
    displayName: api-gateway
    application: dgicp-siip2
    direction: dgicp

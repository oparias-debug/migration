      - Técnico SYMP
      - Coordinador PRE
      - Coordinador SYMP
      - Subjefe DGI
      - Jefe DGI
      parameters:
      - name: codigoSubcriterio
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Escala de calificación del subcriterio solicitado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscalaCalificacionValor'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
        '404':
          description: El subcriterio indicado no existe.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
  /catalogos/especificar-elegibilidad:
    get:
      operationId: listarCatalogoEspecificarElegibilidad
      summary: Consultar los catálogos C.1, C.3, C.4, C.5 y los dos adicionales de "Especificar" (Anexo C)
      description: 'Mismo patrón que `GET /catalogos/medidas` en CU-PRE-03.5 (un endpoint parametrizado por `tipo`, en vez de 6 endpoints separados). El catálogo C.2 (Ejes del Plan de Gobierno) **no** se expone aquí: es el mismo catálogo ya servido por `GET /catalogos/ejes-plan-gobierno` en CU-PRE-03.5.openapi.yaml (mismo concepto de "ejes/pilares del Plan de Gobierno"), reutilizado en vez de duplicado.

        '
      tags:
      - Catálogos - Elegibilidad
      security:
      - bearerAuth: []
      x-roles:
      - Viabilizador
      parameters:
      - name: tipo
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TipoCatalogoEspecificar'
      responses:
        '200':
          description: Listado del catálogo solicitado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaCatalogoEspecificar'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
  /catalogos/indicadores-resultado:
    get:
      operationId: listarIndicadoresResultado
      summary: Consultar el catálogo "C.2 Indicadores de Resultado"
      description: 'Catálogo nuevo (no compartido con otro CU procesado hasta ahora). RN06 menciona que "los CU de Administración del Catálogo de Indicadores" deben definir reglas de mantenimiento periódico — ese CU de administración no ha sido procesado; este fragmento solo expone la consulta de lectura que necesita el selector de `registrarIndicadorResultado`.

        '
      tags:
      - Catálogos - Indicadores del Proyecto
      security:
      - bearerAuth: []
      x-roles:
      - Técnico URP
      parameters:
      - name: busqueda
        in: query
        description: Filtro por palabra clave (FA01, paso 1.2 — "el sistema permitirá filtrar por palabra los indicadores").
        schema:
          type: string
      responses:
        '200':
          description: Listado de indicadores de resultado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndicadorResultadoResumen'
        '401':

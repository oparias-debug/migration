      x-roles:
      - Técnico URP
      parameters:
      - name: departamento
        in: query
        description: Filtra los distritos al departamento indicado.
        schema:
          type: string
      - name: busqueda
        in: query
        description: Autocompletado por palabra clave sobre el nombre del distrito.
        schema:
          type: string
      responses:
        '200':
          description: Listado de ubicaciones geográficas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UbicacionGeografica'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
  /catalogos/unidades-medida:
    get:
      operationId: listarUnidadesMedida
      summary: Consultar el catálogo de unidades de medida (Anexo D.1 de este CU / Anexo C.1 de CU-PRE-09)
      description: 'El propio CU señala que este catálogo "es idéntico en contenido" al del Anexo C.1 de CU-PRE-09 "Análisis de Mercado". Se expone aquí como endpoint propio porque CU-PRE-09 nunca lo expuso como catálogo independiente (allá, `unidadMedida` viaja denormalizado dentro de `ProductoIndicador`/`ProductoSeleccionado`). Si se revisa CU-PRE-09 más adelante, debería evaluarse apuntar a este mismo endpoint en vez de mantener el dato solo denormalizado, para no tener dos fuentes del mismo catálogo.

        '
      tags:
      - Catálogos - Descripción Técnica
      security:
      - bearerAuth: []
      x-roles:
      - Técnico URP
      responses:
        '200':
          description: Listado de unidades de medida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnidadMedidaResumen'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AplicaActualizacionOt:
      type: string
      description: '3 estados de la columna "Campos a habilitar para Actualización de O.T." del Anexo F, distinguidos explícitamente desde la confirmación v1.3 (04/09/2026).

        '
      enum:
      - APLICA
      - NO_APLICA_AL_CU
      - SIN_DATO
    ContenidoIniciativaResumen:
      type: object
      description: 'Fila del "Anexo F — Contenido de Iniciativas de Proyecto" (RN20, confirmado v1.3). `ubicacionCasoUso` es el código del CU donde vive ese contenido (p. ej. "CUPRE-04"); nulo para filas sin CU asignado (sección "5. Documentos anexos", p. ej. "Nota de solicitud de OT"). Nota heredada sin resolver: "Presupuesto de Inversión" y "Fuentes de Financiamiento" comparten la misma celda combinada de `ubicacionCasoUso` ("CUPRE-17") en el documento original — no se puede confirmar si "Fuentes de Financiamiento" debería tener una referencia propia distinta.

        '
      required:
      - contenido
      - aplicaPerfil
      - aplicaPrefactibilidad
      - aplicaFactibilidad
      - aplicaDiseno
      - aplicaPrograma
      - aplicaEstudioGeneral
      - aplicaActualizacionOt
      properties:
        contenido:
          type: string
          description: p. ej. "Antecedentes", "Análisis de Alternativas de Solución", "Descripción Técnica".
        ubicacionCasoUso:
          type: string
          nullable: true
          description: Código del caso de uso (p. ej. "CUPRE-04"); nulo para contenidos sin CU asignado.
        aplicaPerfil:
          type: boolean
        aplicaPrefactibilidad:
          type: boolean
        aplicaFactibilidad:
          type: boolean
        aplicaDiseno:
          type: boolean
        aplicaPrograma:
          type: boolean
        aplicaEstudioGeneral:
          type: boolean
        aplicaActualizacionOt:
          $ref: '#/components/schemas/AplicaActualizacionOt'
    CriterioElegibilidadResumen:
      type: object
      description: 'Entrada del catálogo de criterios (dimensión + criterio + tipo de "Especificar"). Sin campo de ponderación/puntaje — ver nota de alcance en el archivo.

        '
      required:
      - codigo
      - dimension
      - criterio
      - tipoEspecificar
      properties:
        codigo:
          type: string
        dimension:
          type: string
        criterio:
          type: string
        tipoEspecificar:
          $ref: '#/components/schemas/TipoEspecificar'
        catalogoEspecificar:
          allOf:
          - $ref: '#/components/schemas/TipoCatalogoEspecificar'
          nullable: true
          type: string
          description: 'No nulo únicamente si tipoEspecificar = CATALOGO. Ver `TipoCatalogoEspecificar` para cómo resolver cada valor (`GET /catalogos/especificar-elegibilidad` o, para EJE_PLAN_GOBIERNO, `GET /catalogos/ejes-plan-gobierno` de CU-PRE-03.5).

            '
        permiteSeleccionMultiple:
          type: boolean
          description: RN08 — algunos criterios con tipoEspecificar = CATALOGO permiten seleccionar más de un elemento.
    CriterioPriorizacionResumen:
      type: object
      required:
      - codigo
      - numeroCriterio
      - nombreCriterio
      - ponderacionCriterio
      - subcriterios
      properties:
        codigo:
          type: string
        numeroCriterio:
          type: integer
          description: 1 a 4.
        nombreCriterio:
          type: string
        ponderacionCriterio:
          type: number
          format: double
          description: Porcentaje; "sujeto a actualización por parte de la DGI" (Anexo B.1).
        subcriterios:
          type: array
          items:
            $ref: '#/components/schemas/SubcriterioPriorizacionResumen'
    EjePlanGobiernoResumen:
      type: object
      description: Catálogo de Ejes del Plan Cuscatlán (Anexo C.3).
      required:
      - idEjePlanGobierno
      - nombre
      properties:
        idEjePlanGobierno:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
    EjeTematicoResumen:
      type: object
      description: Catálogo "Eje temático" (Anexo C.6).
      required:
      - idEjeTematico
      - nombre
      properties:
        idEjeTematico:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
    EntradaCatalogoEspecificar:
      type: object
      description: Entrada de cualquiera de los catálogos C.1, C.3, C.4, C.5, o los dos adicionales (grupos poblacionales, mejoras en calidad de vida).
      required:
      - codigo
      - nombre
      properties:
        codigo:
          type: string
        nombre:
          type: string
    EscalaCalificacionValor:
      type: object
      description: Fila de la Escala de Calificación de un subcriterio (Anexo C).
      required:
      - valor
      - descripcion
      properties:
        valor:
          $ref: '#/components/schemas/ValorCalificacion'
        descripcion:
          type: string
    IndicadorResultadoResumen:
      type: object
      description: Entrada del catálogo "C.2 Indicadores de Resultado".
      required:
      - codigo
      - nombre
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        unidadMedida:
          type: string
          nullable: true
    InsumoTipoResumen:
      type: object
      description: Entrada del catálogo "Insumo Tipo" (Anexo C, con Factor de Corrección).
      required:
      - codigo
      - nombre
      - factorCorreccion
      properties:
        codigo:
          type: string
        nombre:
          type: string
        factorCorreccion:
          type: number
          format: double
          description: FC — usado para calcular precios ajustados (F1 paso 1.2).
    MacrosectorResumen:
      type: object
      description: 'Catálogo "Macrosectores y sectores" (Anexo C.5), nivel Macrosector. Se asigna automáticamente según el Sector elegido; no es seleccionable directamente.

        '
      required:
      - idMacrosector
      - nombre
      properties:
        idMacrosector:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
    MedidaCatalogo:
      type: object
      description: Entrada del catálogo de medidas (Anexos C.1 GRD, C.1.5 GRC, C.2 ACC).
      required:
      - codigo
      - descripcion
      properties:
        codigo:
          type: string
          description: Código a persistir en medidasGrd/medidasGrc/medidasAcc de ProyectoRequest.
        descripcion:
          type: string
    ParametroResumen:
      type: object
      description: Entrada del catálogo "Parámetros".
      required:
      - codigo
      - nombre
      - factorCorreccion
      properties:
        codigo:
          type: string
        nombre:
          type: string
        factorCorreccion:
          type: number
          format: double
    PlanSectorialRegionalResumen:
      type: object
      description: Catálogo de Planes Sectoriales/Regionales (Anexo C.4).
      required:
      - idPlanSectorialRegional
      - nombre
      properties:
        idPlanSectorialRegional:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
    ProductoIndicador:
      type: object
      description: Entrada del catálogo de Productos e Indicadores (Anexo C.6).
      required:
      - codigoProducto
      - producto
      - codigoIndicador
      - indicador
      - unidadMedida
      - esIndicadorPrincipal
      properties:
        codigoProducto:
          type: string
        producto:
          type: string
        descripcionProducto:
          type: string
          nullable: true
        codigoIndicador:
          type: string
        indicador:
          type: string
        unidadMedida:
          type: string
        esIndicadorPrincipal:
          type: boolean
    RangoInterpretacion:
      type: object
      description: Entrada del Catálogo Rangos de Interpretación (Anexo A.2), contenido confirmado.
      required:
      - puntajeMinimo
      - puntajeMaximo
      - categoria
      - implicacion
      properties:
        puntajeMinimo:
          type: number
          format: double
        puntajeMaximo:
          type: number
          format: double
        categoria:
          type: string
        implicacion:
          type: string
    SectorResumen:
      type: object
      description: Catálogo "Macrosectores y sectores" (Anexo C.5), nivel Sector.
      required:
      - idSector
      - nombre
      - macrosector
      properties:
        idSector:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        macrosector:
          $ref: '#/components/schemas/MacrosectorResumen'
    SubcriterioPriorizacionResumen:
      type: object
      description: 'Subcriterio dentro de un criterio (ver ambigüedad de contenido en info.description del archivo).

        '
      required:
      - codigo
      - numero
      - nombre
      - ponderacionSubcriterio
      properties:
        codigo:
          type: string
        numero:
          type: string
          description: 'Ejemplo confirmado: "1.1", "1.2"... (Criterio 1, único con datos de ejemplo verificados).'
        nombre:
          type: string
        ponderacionSubcriterio:
          type: number
          format: double
          description: Porcentaje dentro del criterio; "sujeto a actualización por parte de la DGI" (Anexo B.1).
    TipoCatalogoEspecificar:
      type: string
      description: 'A cuál catálogo de "Especificar" pertenece un criterio con `tipoEspecificar = CATALOGO`. `EJE_PLAN_GOBIERNO` (catálogo C.2) es el único valor que **no** se resuelve con `GET /catalogos/especificar-elegibilidad` — se resuelve con `GET /catalogos/ejes-plan-gobierno` de CU-PRE-03.5.openapi.yaml.

        '
      enum:
      - ODS
      - EJE_PLAN_GOBIERNO
      - COMPONENTE_MEDIO_AMBIENTE
      - MEDIDA_GRD
      - MEDIDA_ACC
      - GRUPO_POBLACIONAL_VULNERABLE
      - MEJORA_CALIDAD_VIDA
    TipoCostoResumen:
      type: object
      description: Entrada del catálogo "Tipo de Costos" (Anexo C.2).
      required:
      - codigo
      - nombre
      properties:
        codigo:
          type: string
        nombre:
          type: string
    TipoEspecificar:
      type: string
      description: Sub-formato de la columna "Especificar" según el criterio (Anexo B).
      enum:
      - SI_NO
      - CATALOGO
      - TEXTO_LIBRE
    TipoMedidaCatalogo:
      type: string
      description: 'Tipo de catálogo de medidas referenciado por el botón "Ver descripción de categorías".

        '
      enum:
      - GRD
      - GRC
      - ACC
    TipoUnidadMedida:
      type: string
      enum:
      - BIEN
      - SERVICIO
      - MIXTA
    UbicacionGeografica:
      type: object
      description: Entrada del catálogo de ubicaciones geográficas (Anexo C.5).
      required:
      - distrito
      - departamento
      - region
      properties:
        distrito:
          type: string
        departamento:
          type: string
        region:
          type: string
    UnidadMedidaResumen:
      type: object
      description: Entrada del catálogo de unidades de medida.
      required:
      - tipo
      - categoria
      - unidadMedida
      properties:
        tipo:
          $ref: '#/components/schemas/TipoUnidadMedida'
        categoria:
          type: string
        unidadMedida:
          type: string
        descripcion:
          type: string
          nullable: true
    ValorCalificacion:
      type: string
      description: 'Botón radial con 7 valores posibles (RN08). "NO_APLICA" corresponde a "N/A"; el resto son los puntajes numéricos 0 a 5.

        '
      enum:
      - NO_APLICA
      - CERO
      - UNO
      - DOS
      - TRES
      - CUATRO
      - CINCO

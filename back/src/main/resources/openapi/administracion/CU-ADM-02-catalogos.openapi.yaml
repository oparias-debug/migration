      summary: Consultar el catálogo de ubicaciones geográficas (Anexo C.5)
      description: 'RN sobre el campo "Distrito": "Solamente se mostrarán los distritos del Departamento seleccionado" (parámetro `departamento`) y "la celda permitirá digitar una palabra clave y el Sistema la autocompletará" (parámetro `busqueda`). Incluye entradas especiales de nivel departamental (p. ej. "Ahuachapán - Nivel departamental") además de los distritos individuales, tal como aparecen en el catálogo original; "Nivel nacional" (mencionado en el campo "Coordenadas" de la Ficha de emergencia) también se modela como un valor más de `distrito`, no como un concepto propio.


  /catalogos/escala-calificacion-subcriterio:
    get:
      operationId: listarEscalaCalificacionSubcriterio
      summary: Consultar la Escala de Calificación de un subcriterio (botón "Ver Escala de Calificación", RN08, Anexo C)
      description: 'Cada subcriterio tiene su propia escala descriptiva para los valores N/A y 0-5 (Anexo C) — disponible para todos los actores del CU, sin restricción de rol adicional a la autenticación misma.

        '
      tags:

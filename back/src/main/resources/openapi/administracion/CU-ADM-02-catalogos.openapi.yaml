openapi: 3.0.3
info:
  title: SIIP - Preinversión - Catálogos Consolidados
  version: 1.0.0
  description: 'Fragmento OpenAPI de CATÁLOGOS CONSOLIDADOS de todo el módulo de

    Preinversión. Creado el 10/09/2026 a partir de un hallazgo real reportado

    por el pipeline de generación de código (Maven/openapi-generator): todos

    los endpoints de catálogo del contrato compartían el mismo tag

    "Catálogos Preinversión" en 9 archivos distintos (CU-PRE-01, 02, 3.5, 11,

    17, 20, 23, 25, 26.5). Como openapi-generator genera un archivo Java por

    tag (no por fragmento de origen), y cada fragmento se ejecuta como su

    propia <execution> de Maven contra el mismo apiPackage, la ejecución que

    corre al final sobrescribía por completo el archivo generado de las

    ejecuciones anteriores para ese mismo tag — perdiendo silenciosamente los

    métodos de catálogo de todos los demás CU. El síntoma reportado

    específicamente fue en CU-PRE-01 (5 operaciones), CU-PRE-02 (1) y

    CU-PRE-11 (1), pero el inventario completo mostró que el riesgo alcanzaba

    a los 9 archivos (19 operaciones en total) — no solo a los 3 señalados.


    Se consolidaron aquí TODOS los endpoints /catalogos/* de todo el contrato

    (incluidos los de CU-PRE-03.5, que aunque no colisionaban hoy, usaban el

    mismo tag genérico y habrían colisionado con el primer CU nuevo que lo

    reutilizara). Cada operación se retaggeó con un tag específico por CU de

    origen (p. ej. "Catálogos - Elegibilidad", "Catálogos - Priorización") en

    vez del tag genérico compartido — así, aunque todos vivan en este mismo

    archivo/ejecución de Maven, cada uno genera su propia interfaz Java sin

    colisionar entre sí, según el mismo patrón que ya funcionaba sin

    problemas para "Catálogos Selección y Registro de Etapas" (tag único de

    CU-PRE-03.5, que el reporte original identificó correctamente como el

    patrón a seguir).


    Todos los fragmentos de origen (CU-PRE-01, 02, 3.5, 11, 17, 20, 23, 25,

    26.5) fueron actualizados para eliminar estos paths y schemas, y para

    referenciarlos aquí vía `$ref` externo donde los necesitan como parte de

    sus propios modelos de dominio (p. ej. `Proyecto.sector` en CU-PRE-01,

    `Beneficio.parametro` en CU-PRE-20). Los archivos que ya reutilizaban

    alguno de estos catálogos desde otro fragmento (CU-PRE-18 → InsumoTipoResumen

    de CU-PRE-17; CU-PRE-11/17 → TipoCostoResumen de CU-PRE-03.5; CU-PRE-26 →

    ContenidoIniciativaResumen de CU-PRE-03.5) también se actualizaron para

    apuntar aquí en vez de al archivo de origen anterior. Ver

    contrato-CU-PRE-00-catalogos.md para el detalle completo de la migración,

    archivo por archivo.'
paths:
  /catalogos/contenido-iniciativas-proyecto:
    get:
      operationId: listarContenidoIniciativasProyecto
      summary: Consultar el "Anexo F — Contenido de Iniciativas de Proyecto" (RN20)
      description: '✅ Confirmado (04/09/2026, decisión funcional v1.3): este catálogo corresponde efectivamente al anexo referenciado por RN20 — antes sin confirmar, lo que dejaba a `CU-PRE-26.openapi.yaml` con un campo genérico (`camposHabilitados: array of string`) por falta de esta misma confirmación; ese fragmento debería actualizarse para referenciar este catálogo real (ver contrato-CU-PRE-03.5.md). Determina, para cada "contenido" (Antecedentes, Análisis de Alternativas de Solución, Descripción Técnica, etc.), en cuáles etapas de la Ruta de Preinversión aplica, y si aplica al proceso de Actualización de Opinión Técnica — con 3 estados posibles en esta última columna, ahora distinguidos explícitamente: "X" (aplica, `APLICA`), "-" guion (no aplica al caso de uso, `NO_APLICA_AL_CU`) y celda vacía (ausencia de dato, `SIN_DATO`) — antes de esta confirmación no era posible distinguir los dos últimos casos.

        '
      tags:
      - Catálogos - Selección y Registro de Etapas
      security:
      - bearerAuth: []
      x-roles:
      - Técnico URP
      responses:
        '200':
          description: Listado del contenido de iniciativas de proyecto (30 filas, Anexo F).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContenidoIniciativaResumen'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
  /catalogos/criterios-elegibilidad:
    get:
      operationId: listarCriteriosElegibilidad
      summary: Consultar el catálogo de criterios de elegibilidad (dimensiones y criterios)
      description: '⚠️ No incluye ningún campo de ponderación ni puntaje — ver info.description del archivo y contrato-CU-PRE-25.md sobre el mayor hueco de este fragmento (tabla de 6 dimensiones/20 criterios/100 puntos, sin pertenencia confirmada a este CU). Solo expone la estructura necesaria para renderizar la tabla de selección: a qué dimensión pertenece cada criterio, y qué tipo de control usa su columna "Especificar" (RN08: algunos permiten selección múltiple).

        '
      tags:
      - Catálogos - Elegibilidad
      security:
      - bearerAuth: []
      x-roles:
      - Viabilizador
      responses:
        '200':
          description: Listado de criterios de elegibilidad.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CriterioElegibilidadResumen'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
  /catalogos/criterios-priorizacion:
    get:
      operationId: listarCriteriosPriorizacion
      summary: Consultar el catálogo de criterios y subcriterios de priorización
      description: '⚠️ Contenido bloqueado por ambigüedad de versión — ver info.description del archivo. Este endpoint expone la forma estructural necesaria (criterio → subcriterios → ponderaciones), pero su contenido real (número de subcriterios por criterio y sus ponderaciones exactas) debe resolverse antes de implementar el backend, una vez el negocio confirme cuál de las dos versiones del anexo Excel es la vigente.

        '
      tags:
      - Catálogos - Priorización
      security:
      - bearerAuth: []
      x-roles:
      - Técnico PRE
      - Técnico SYMP
      responses:
        '200':
          description: Listado de criterios con sus subcriterios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CriterioPriorizacionResumen'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: ../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error
  /catalogos/ejes-plan-gobierno:
    get:
      operationId: listarEjesPlanGobierno
      summary: 'Consultar el catálogo de Ejes del Plan Cuscatlán (Anexo C.3) — fuente del listado seleccionable del campo "Línea/Eje del Plan de Gobierno"


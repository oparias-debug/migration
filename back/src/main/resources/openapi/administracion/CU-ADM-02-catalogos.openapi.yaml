      description: 'El propio CU aclara: "Este catálogo estará sujeto a actualización por parte de la DGICP" — a diferencia de Tipo de capital/Tamaño/Complejidad (Anexos C.1/C.3/C.4), que son listados fijos modelados como enum (`TipoCapital`, `TamanioProyecto`, `ComplejidadProyecto`) sin necesidad de endpoint propio, este catálogo sí es administrado y requiere uno.


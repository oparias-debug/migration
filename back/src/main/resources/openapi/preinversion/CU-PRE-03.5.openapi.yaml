        totalComponentesCosto:
          type: number
          format: double
          nullable: true
          description: Suma calculada de componentesCosto; debe igualar inversionEstimada (Anexo B.1).
        costosOperacion: { type: number, format: double, nullable: true }
        costosMantenimiento: { type: number, format: double, nullable: true }
        fuentesFinanciamiento:
          type: array
          items:
            $ref: './CU-PRE-17.openapi.yaml#/components/schemas/FuenteFinanciamiento'
        fuenteRecursos: { type: string, nullable: true }
        archivoProgramacionUrl: { type: string, nullable: true }
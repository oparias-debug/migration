# SonarQube para el pipeline institucional (Tekton / Developer Hub), usando
# el mismo project-key ya registrado en catalog-info.yaml. Es independiente
# del sonar.projectKey=siip-back configurado en ../pom.xml:39, que cubre el
# flujo de desarrollo local (docker-compose + `mvn sonar:sonar` desde la raíz
# del reactor, ver ../CONTRIBUTING.md). No se validó todavía que ambos
# mecanismos convivan sin pisarse al correr el scanner de Maven sobre este
# módulo — ver README.md § Pendientes / por revisar.
sonar.jacoco.version=0.8.6
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/jacoco-report/jacoco.xml
sonar.dynamicAnalysis=reuseReports
sonar.exclusions=Dockerfile,**/model/*/api/**,**/model/*/dto/**
sonar.coverage.exclusions=**/model/*/api/**,**/model/*/dto/**
sonar.java.binaries=target/classes
sonar.projectKey=dgicp-siip2-backend-srv
sonar.projectName=dgicp-siip2-backend-srv
sonar.host.url=http://alcm.mh.gob.sv/e/sonar

openapi: 3.0.3
info:
  title: SIIP - Preinversión - CU-PRE-16 Análisis Legal
  version: "1.0.0"
  description: >
    Fragmento OpenAPI derivado de CU-PRE-16 "Análisis Legal"
    (UC-PRE-16-Analisis_Legal.md) y sus 3 historias BDD. Actor principal:
    Técnico URP. Actor secundario de solo lectura: Técnico PRE. Mismo
    criterio que toda la serie CU-PRE-06 a CU-PRE-15 para RN01: `x-roles`
    no incluye "Usuarios Internos/Externos". Introduce el recurso
    `AnalisisLegal`, hijo de `Proyecto`. Sin catálogos (el propio CU no
    incluye ningún Anexo C). A diferencia de CU-PRE-15, "Siguiente" (FA-02)
    no tiene ninguna validación documentada — el propio CU-PRE-16.md lo
    señala explícitamente como diferencia frente a ese fragmento.

paths:

  /proyectos/{idProyecto}/analisis-legal:
    parameters:
      - name: idProyecto
        in: path
        required: true
        schema: { type: integer, format: int64 }

    get:
      operationId: obtenerAnalisisLegal
      summary: Consultar la pantalla "Análisis Legal" (Anexo A.1)
      description: >
        Igual que el resto de la serie CU-PRE-06 a CU-PRE-15: ninguna regla
        de este CU condiciona el acceso de Técnico PRE a que la información
        ya se haya guardado al menos una vez; no se modeló ese 404 condicional.
      tags: [Preinversión - Análisis Legal]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP, Técnico PRE]
      responses:
        "200":
          description: Análisis legal del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisLegal'
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "403":
          description: >
            El actor autenticado no es Técnico URP ni Técnico PRE, o
            (Técnico URP/Técnico PRE) el proyecto no está dentro de su
            alcance de Unidad Ejecutora (RN01/RN02). Inferido de `x-roles`;
            sin escenario BDD negativo explícito.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "404":
          description: El proyecto no existe.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'

    put:
      operationId: guardarAnalisisLegal
      summary: Registrar y guardar el análisis legal (botón "Guardar", FA-01)
      description: >
        RN05 (bordes rojos) es puramente visual, mismo criterio que el
        resto de la serie — no genera 400. `costoEntregable` es
        explícitamente no obligatorio (Validaciones, y escenario BDD
        dedicado); `totalCostoEntregables` nunca se envía, es siempre
        calculado por el servidor como la suma de `costoEntregable` de
        todas las filas.
      tags: [Preinversión - Análisis Legal]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalisisLegalRequest'
      responses:
        "200":
          description: >
            Información guardada (mensaje "Sus datos han sido guardados
            exitosamente. Recuerde que los costos derivados del análisis
            legal deben estar considerados dentro del presupuesto del
            proyecto.", Anexo A.2); el modal y su "Aceptar" son de cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisLegal'
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "403":
          description: >
            El actor autenticado no es Técnico URP, o el proyecto no está en
            su alcance de Unidad Ejecutora (RN01). Inferido de `x-roles`;
            sin escenario BDD negativo explícito.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "404":
          description: El proyecto no existe.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    FilaAnalisisLegalRequest:
      type: object
      description: >
        Fila de la tabla "Análisis Legal". Se reutiliza también como forma
        de lectura (mismo criterio que `InteresadoRequest` en CU-PRE-06,
        `FilaLocalizacionRequest` en CU-PRE-12 y `FilaImpactoAmbientalRequest`
        en CU-PRE-14: no hay campos calculados por el servidor a nivel de
        fila). Ningún campo es obligatorio a nivel de schema (ver
        descripción de `guardarAnalisisLegal`). Agregar/eliminar una fila
        (RN03) ocurre en el cliente antes del `PUT` — reemplazo completo
        del array. `analisisGestionLegalRequerida` no tiene `maxLength`: el
        propio CU señala, a diferencia de campos de texto similares en
        otros CU de la serie (p. ej. "Descripción del producto" en
        CU-PRE-11, "Impacto"/"Medida de gestión" en CU-PRE-14), que no
        especifica una amplitud máxima de caracteres para este campo.
      properties:
        analisisGestionLegalRequerida:
          type: string
        entregable:
          type: string
        costoEntregable:
          type: number
          format: double
          nullable: true
          description: >
            Validaciones: explícitamente NO obligatorio (a diferencia de
            los otros dos campos de la fila); escenario BDD dedicado
            confirma que se puede guardar la fila sin este valor.

    AnalisisLegalRequest:
      type: object
      properties:
        requiereAnalisisLegal:
          type: boolean
          nullable: true
          description: >
            RN04: si es true, `filas` es relevante y se despliega en
            pantalla; si es false, la tabla no se despliega en el cliente.
            No se fuerza como restricción de servidor.
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaAnalisisLegalRequest'

    AnalisisLegal:
      type: object
      description: Análisis legal del proyecto (lectura).
      required: [idProyecto, filas]
      properties:
        idProyecto:
          type: integer
          format: int64
        requiereAnalisisLegal:
          type: boolean
          nullable: true
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaAnalisisLegalRequest'
        totalCostoEntregables:
          type: number
          format: double
          nullable: true
          description: >
            Calculado por el servidor como la suma de `costoEntregable` de
            todas las filas; nunca se recibe en `AnalisisLegalRequest`.

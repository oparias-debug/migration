openapi: 3.0.3
info:
  title: SIIP - Preinversion - CU-PRE-08 Area de Influencia
  version: "1.0.0"
  description: Contrato del area de influencia del proyecto.
paths:
  /proyectos/{idProyecto}/area-influencia:
    parameters:
      - name: idProyecto
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: obtenerAreaInfluencia
      summary: Consultar el area de influencia
      tags: [Preinversion - Area de Influencia]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP, Técnico PRE]
      responses:
        "200":
          description: Area de influencia del proyecto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaInfluencia' }
        "401":
          description: No autenticado.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "403":
          description: Actor sin acceso al proyecto.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "404":
          description: Proyecto inexistente.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
    put:
      operationId: guardarAreaInfluencia
      summary: Guardar el area de influencia
      tags: [Preinversion - Area de Influencia]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaInfluenciaRequest' }
      responses:
        "200":
          description: Area de influencia guardada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaInfluencia' }
        "400":
          description: >
            Solicitud invalida; no se guarda nada. `DISTRITO_INVALIDO`: un distrito vacio,
            inexistente o cuyo nombre corresponde a varios distritos del catalogo (p. ej.
            "San Lorenzo"); `FILA_DUPLICADA`: dos filas con el mismo distrito y la misma
            ubicacion especifica. `Error.detalles[].campo` indica cada fila. El guardado admite
            filas sin "Ubicacion especifica" (decision de negocio sobre RN05).
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "401":
          description: No autenticado.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "403":
          description: Actor sin permiso o proyecto fuera de alcance.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "404":
          description: Proyecto inexistente.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
  /proyectos/{idProyecto}/area-influencia/autocompletado:
    parameters:
      - name: idProyecto
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: autocompletarAreaInfluenciaDesdePoblacionObjetivo
      summary: Autocompletar desde Poblacion Objetivo
      tags: [Preinversion - Area de Influencia]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP]
      responses:
        "200":
          description: >
            Filas propuestas a partir de las ubicaciones de Poblacion Objetivo (CU-PRE-07), sin
            guardar. Si una ubicacion no identifica un unico distrito del catalogo (texto libre
            como "Comunidad Rio Mar"), la fila trae region, departamento y distrito en null y el
            texto como ubicacionEspecifica, para que el Tecnico URP elija el distrito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaInfluencia' }
        "401":
          description: No autenticado.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "403":
          description: Actor sin permiso o proyecto fuera de alcance.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
        "404":
          description: Proyecto inexistente.
          content:
            application/json:
              schema: { $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AreaInfluenciaFilaRequest:
      type: object
      required: [distrito]
      properties:
        distrito:
          type: string
          description: >
            Codigo (recomendado) o nombre del distrito del catalogo geografico. Un nombre que
            corresponde a varios distritos se rechaza con `DISTRITO_INVALIDO`.
        ubicacionEspecifica:
          type: string
          maxLength: 1000
    AreaInfluenciaRequest:
      type: object
      required: [filas]
      properties:
        filas:
          type: array
          items: { $ref: '#/components/schemas/AreaInfluenciaFilaRequest' }
    AreaInfluenciaFila:
      type: object
      required: [region, departamento, distrito]
      description: >
        Region, departamento y distrito solo vienen en null en las filas propuestas por el
        autocompletado cuya ubicacion no identifica un distrito; las filas guardadas los traen siempre.
      properties:
        region: { type: string, nullable: true }
        departamento: { type: string, nullable: true }
        distrito: { type: string, nullable: true }
        ubicacionEspecifica: { type: string, nullable: true }
    AreaInfluencia:
      type: object
      required: [idProyecto, filas]
      properties:
        idProyecto: { type: integer, format: int64 }
        filas:
          type: array
          items: { $ref: '#/components/schemas/AreaInfluenciaFila' }

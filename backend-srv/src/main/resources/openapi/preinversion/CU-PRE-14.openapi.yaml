openapi: 3.0.3
info:
  title: SIIP - Preinversión - CU-PRE-14 Análisis Ambiental
  version: "1.0.0"
  description: >
    Fragmento OpenAPI derivado de CU-PRE-14 "Análisis Ambiental"
    (UC-PRE-14-Analisis_Ambiental.md) y sus 3 historias BDD. Actor
    principal: Técnico URP. Actor secundario de solo lectura: Técnico PRE.
    Mismo criterio que toda la serie CU-PRE-06 a CU-PRE-12 para RN01:
    `x-roles` no incluye "Usuarios Internos/Externos". Introduce el recurso
    `AnalisisAmbiental`, hijo de `Proyecto`. Los 5 catálogos (Medio, Impacto,
    Magnitud, Duración, Reversibilidad) son listados fijos y pequeños, sin
    nota de administración externa; se modelan como `enum`, sin endpoint
    propio (mismo criterio que CU-PRE-06). RN07 ("filas anidadas por cada
    tipo de medio") no se modela: ni el CU ni la BDD desarrollan qué es una
    "fila anidada" ni cómo se representa — ver contrato-CU-PRE-14.md.

paths:

  /proyectos/{idProyecto}/analisis-ambiental:
    parameters:
      - name: idProyecto
        in: path
        required: true
        schema: { type: integer, format: int64 }

    get:
      operationId: obtenerAnalisisAmbiental
      summary: Consultar la pantalla "Análisis Ambiental" (Anexo A.1)
      description: >
        Igual que el resto de la serie CU-PRE-06 a CU-PRE-12: ninguna regla
        de este CU condiciona el acceso de Técnico PRE a que la información
        ya se haya guardado al menos una vez; no se modeló ese 404 condicional.
      tags: [Preinversión - Análisis Ambiental]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP, Técnico PRE]
      responses:
        "200":
          description: Análisis ambiental del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisAmbiental'
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "403":
          description: >
            El actor autenticado no es Técnico URP ni Técnico PRE, o
            (Técnico URP/Técnico PRE) el proyecto no está dentro de su
            alcance de Unidad Ejecutora (RN01/RN02). Inferido de `x-roles`;
            sin escenario BDD negativo explícito.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "404":
          description: El proyecto no existe.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'

    put:
      operationId: guardarAnalisisAmbiental
      summary: Registrar y guardar el análisis ambiental (botón "Guardar", FA-01)
      description: >
        RN05 (bordes rojos) es puramente visual, mismo criterio que
        CU-PRE-04/05/06/08/11/12 — no genera 400. Nótese que, a diferencia
        de CUs anteriores de la serie, la tabla de Campos de este CU sí
        marca explícitamente "Obligatorio: Sí" para Medio, Impacto, Tipo de
        impacto, Magnitud, Duración, Reversibilidad y Medida de gestión (en
        vez de "No especificado en el documento"); aun así, el único
        mecanismo de validación que describe el CU para campos faltantes
        sigue siendo el sombreado en rojo (RN05), sin un escenario BDD de
        rechazo de guardado — por eso se mantiene el mismo criterio de "no
        rechaza" que el resto de la serie, no se trata de una inconsistencia
        de este fragmento. `costoMedidaGestion` es explícitamente no
        obligatorio (Validaciones, y escenario BDD dedicado); `totalCostoMedidasGestion`
        nunca se envía, es siempre calculado por el servidor como la suma
        de `costoMedidaGestion` de todas las filas.
      tags: [Preinversión - Análisis Ambiental]
      security: [{ bearerAuth: [] }]
      x-roles: [Técnico URP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalisisAmbientalRequest'
      responses:
        "200":
          description: >
            Información guardada (mensaje "Sus datos han sido guardados
            exitosamente. Recuerde que los costos derivados del análisis
            ambiental deben estar considerados dentro del presupuesto del
            proyecto.", Anexo A.2); el modal y su "Aceptar" son de cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalisisAmbiental'
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "403":
          description: >
            El actor autenticado no es Técnico URP, o el proyecto no está en
            su alcance de Unidad Ejecutora (RN01). Inferido de `x-roles`;
            sin escenario BDD negativo explícito.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'
        "404":
          description: El proyecto no existe.
          content:
            application/json:
              schema:
                $ref: '../administracion/CU-ADM-03-manejo-errores.openapi.yaml#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Medio:
      type: string
      description: Catálogo Medio (Anexo C.1), listado fijo.
      enum:
        - FISICO_AGUA
        - FISICO_TIERRA
        - FISICO_AIRE
        - BIOLOGICO_FLORA
        - BIOLOGICO_FAUNA
        - SOCIAL_ESTRUCTURA_SOCIAL
        - SOCIAL_PATRIMONIO_CULTURAL

    TipoImpacto:
      type: string
      description: Catálogo Impacto (Anexo C.2), listado fijo.
      enum: [POSITIVO, NEGATIVO]

    Magnitud:
      type: string
      description: Catálogo Magnitud (Anexo C.3), listado fijo.
      enum: [LEVE, MODERADO, FUERTE]

    Duracion:
      type: string
      description: Catálogo Duración (Anexo C.4), listado fijo.
      enum: [CORTO_PLAZO, MEDIANO_PLAZO, LARGO_PLAZO]

    Reversibilidad:
      type: string
      description: Catálogo Reversibilidad (Anexo C.5), listado fijo.
      enum: [REVERSIBLE, IRREVERSIBLE]

    FilaImpactoAmbientalRequest:
      type: object
      description: >
        Fila de la matriz de gestión ambiental. Se reutiliza también como
        forma de lectura (mismo criterio que `AlternativaSolucionRequest`
        en CU-PRE-05, `InteresadoRequest` en CU-PRE-06 y
        `FilaLocalizacionRequest` en CU-PRE-12: no hay campos calculados por
        el servidor a nivel de fila). Ningún campo es obligatorio a nivel de
        schema (ver descripción de `guardarAnalisisAmbiental`). Agregar/
        eliminar una fila (RN03) ocurre en el cliente antes del `PUT` —
        reemplazo completo del array. No incluye estructura de "filas
        anidadas" (RN07) — ver contrato-CU-PRE-14.md.
      properties:
        medio:
          $ref: '#/components/schemas/Medio'
        impacto:
          type: string
          maxLength: 200
          description: Campo "Descripción del Impacto"/"Impacto".
        tipoImpacto:
          $ref: '#/components/schemas/TipoImpacto'
        magnitud:
          $ref: '#/components/schemas/Magnitud'
        duracion:
          $ref: '#/components/schemas/Duracion'
        reversibilidad:
          $ref: '#/components/schemas/Reversibilidad'
        medidaGestion:
          type: string
          maxLength: 200
        costoMedidaGestion:
          type: number
          format: double
          nullable: true
          description: >
            Validaciones: explícitamente NO obligatorio (a diferencia del
            resto de campos de la fila, marcados "Sí" en la tabla de
            Campos); escenario BDD dedicado confirma que se puede guardar
            la fila sin este valor.

    AnalisisAmbientalRequest:
      type: object
      properties:
        tieneImpactosAmbientales:
          type: boolean
          nullable: true
          description: >
            RN04: si es true, `filas` es relevante y se despliega en
            pantalla; si es false, la tabla no se despliega en el cliente.
            No se fuerza como restricción de servidor que `filas` deba estar
            vacío cuando es false — no hay escenario BDD que lo pruebe.
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaImpactoAmbientalRequest'

    AnalisisAmbiental:
      type: object
      description: Análisis ambiental del proyecto (lectura).
      required: [idProyecto, filas]
      properties:
        idProyecto:
          type: integer
          format: int64
        tieneImpactosAmbientales:
          type: boolean
          nullable: true
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaImpactoAmbientalRequest'
        totalCostoMedidasGestion:
          type: number
          format: double
          nullable: true
          description: >
            Calculado por el servidor como la suma de `costoMedidaGestion`
            de todas las filas; nunca se recibe en `AnalisisAmbientalRequest`.

# Perfil dev: SOLO local (docker-compose.yml / dist-tester, SPRING_PROFILES_ACTIVE=dev).
# Activa los DevSeeder (@Profile("dev")) y recrea el esquema en cada arranque. Nunca activarlo
# en un ambiente de la entidad: borra los datos al reiniciar.
# El resto de la configuración se hereda de application.yml.
spring:
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: ${JPA_SHOW_SQL:true}

flowable:
  # Debe seguir a spring.jpa.hibernate.ddl-auto: create-drop de arriba: si el schema
  # `public` se recrea en cada reinicio pero `flowable` no, los process instances/tasks
  # de una corrida anterior quedan huérfanos y reusan el mismo businessKey (el id de
  # proyecto vuelve a empezar en 1), causando "Query return 2 results instead of max 1".
  database-schema-update: ${FLOWABLE_DB_SCHEMA_UPDATE:drop-create}

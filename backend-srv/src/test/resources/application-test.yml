spring:
  datasource:
    url: jdbc:h2:mem:cucumber;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa.hibernate.ddl-auto: create-drop
  # Las pruebas no hablan con Keycloak: usan jwt() de spring-security-test o
  # AutenticacionDePrueba, que no pasan por el decodificador.
  security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:0/mock-oidc

gateway.url: http://localhost:8080

# Las pruebas no envían auditoría ni logs remotos a auditoria-service: puerto 0 falla al
# instante (el envío es asíncrono y un fallo solo queda en el log local).
audit.service.url: http://localhost:0/api/v1/audit
remote.logger.enabled: false
